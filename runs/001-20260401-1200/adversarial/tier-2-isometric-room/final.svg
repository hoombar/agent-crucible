  <polygon points="127,150 127,133 135,129 135,146" fill="#C41E3A"/>
  <polygon points="135,129 143,133 143,150 135,146" fill="#A0182E"/>
  <polygon points="127,133 135,129 143,133 135,137" fill="#E8304A"/>
  <!-- Book 2 - blue -->
  <polygon points="144,146 144,131 152,127 152,142" fill="#1E90FF"/>
  <polygon points="152,127 160,131 160,146 152,142" fill="#1670CC"/>
  <polygon points="144,131 152,127 160,131 152,135" fill="#3AA0FF"/>
