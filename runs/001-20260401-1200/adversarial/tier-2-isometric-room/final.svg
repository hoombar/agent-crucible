<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFA500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B3B"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <clipPath id="moonClip">
      <circle cx="570" cy="95" r="10"/>
    </clipPath>
    <linearGradient id="leftWallGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d4c35"/>
      <stop offset="100%" stop-color="#4a3020"/>
    </linearGradient>
    <linearGradient id="rightWallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="60%" stop-color="#6d4830"/>
      <stop offset="100%" stop-color="#4a3228"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#12101a"/>

  <!-- === ROOM STRUCTURE (Isometric) === -->
  <!-- Floor -->
  <polygon points="400,450 100,280 400,110 700,280" fill="#3d2b1f"/>
  <!-- Left wall -->
  <polygon points="100,280 400,110 400,10 100,180" fill="url(#leftWallGrad)"/>
  <!-- Right wall -->
  <polygon points="400,110 700,280 700,180 400,10" fill="url(#rightWallGrad)"/>

  <!-- === RUG on floor === -->
  <!-- Rug base with edge shadow -->
  <polygon points="400,345 258,273 400,196 542,273" fill="#000000" opacity="0.15"/>
  <polygon points="400,340 260,270 400,195 540,270" fill="#7a3c1e" opacity="0.95"/>
  <!-- Concentric diamond bands -->
  <polygon points="400,328 280,274 400,212 520,274" fill="#9c5030"/>
  <polygon points="400,316 300,274 400,228 500,274" fill="#b86840"/>
  <polygon points="400,304 320,274 400,244 480,274" fill="#cc8855"/>
  <!-- Cross-hatch pattern lines on rug -->
  <line x1="310" y1="274" x2="400" y2="234" stroke="#5a2810" stroke-width="0.7" opacity="0.5"/>
  <line x1="340" y1="274" x2="400" y2="248" stroke="#5a2810" stroke-width="0.7" opacity="0.5"/>
  <line x1="370" y1="274" x2="400" y2="260" stroke="#5a2810" stroke-width="0.7" opacity="0.5"/>
  <line x1="430" y1="274" x2="400" y2="260" stroke="#5a2810" stroke-width="0.7" opacity="0.5"/>
  <line x1="460" y1="274" x2="400" y2="248" stroke="#5a2810" stroke-width="0.7" opacity="0.5"/>
  <line x1="490" y1="274" x2="400" y2="234" stroke="#5a2810" stroke-width="0.7" opacity="0.5"/>
  <!-- Perpendicular cross lines -->
  <line x1="330" y1="254" x2="470" y2="254" stroke="#5a2810" stroke-width="0.5" opacity="0.4"/>
  <line x1="310" y1="264" x2="490" y2="264" stroke="#5a2810" stroke-width="0.5" opacity="0.4"/>
  <line x1="350" y1="244" x2="450" y2="244" stroke="#5a2810" stroke-width="0.5" opacity="0.4"/>
  <!-- Small repeated diamond motifs -->
  <polygon points="360,260 370,255 380,260 370,265" fill="#a05828" opacity="0.6"/>
  <polygon points="420,260 430,255 440,260 430,265" fill="#a05828" opacity="0.6"/>
  <polygon points="390,245 400,240 410,245 400,250" fill="#a05828" opacity="0.6"/>
  <polygon points="390,280 400,275 410,280 400,285" fill="#a05828" opacity="0.6"/>
  <!-- Rug outer border -->
  <line x1="260" y1="270" x2="400" y2="195" stroke="#5a2810" stroke-width="2"/>
  <line x1="400" y1="195" x2="540" y2="270" stroke="#5a2810" stroke-width="2"/>
  <line x1="540" y1="270" x2="400" y2="340" stroke="#5a2810" stroke-width="2"/>
  <line x1="400" y1="340" x2="260" y2="270" stroke="#5a2810" stroke-width="2"/>

