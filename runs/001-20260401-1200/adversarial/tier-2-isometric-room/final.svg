  <!-- Window glass - night sky -->
  <polygon points="530,70 640,128 640,220 530,162" fill="url(#nightSky)"/>
  <!-- Stars -->
  <circle cx="545" cy="95" r="1.5" fill="#FFFFFF"/>
  <circle cx="558" cy="85" r="1" fill="#FFFFFF"/>
  <circle cx="600" cy="105" r="1.5" fill="#FFFFFF"/>
  <circle cx="625" cy="140" r="1" fill="#FFFFFF"/>
  <circle cx="550" cy="120" r="1" fill="#FFFFFF"/>
  <circle cx="612" cy="150" r="1.2" fill="#FFFFFF"/>
  <circle cx="538" cy="135" r="0.8" fill="#FFFFFF"/>
  <circle cx="620" cy="165" r="1" fill="#FFFFFF"/>
  <circle cx="555" cy="150" r="0.7" fill="#FFFFFF"/>
  <circle cx="630" cy="180" r="0.9" fill="#FFFFFF"/>
  <!-- Crescent Moon using clip path (repositioned away from stars) -->
  <g clip-path="url(#moonClip)">
    <circle cx="570" cy="95" r="10" fill="#F0E68C"/>
    <circle cx="576" cy="91" r="9" fill="#0B0B3B"/>
  </g>
  <!-- Window mullion - vertical (following right wall isometric slant) -->
  <polygon points="580,70 584,72 596,218 592,216" fill="#8B7355"/>
  <!-- Window mullion - horizontal -->
  <polygon points="530,115 640,173 640,177 530,119" fill="#8B7355"/>

  <!-- === BOOKSHELF on left wall (flush against wall) === -->
  <!-- Bookshelf floor shadow -->
  <polygon points="125,273 140,281 255,220 240,212" fill="#000000" opacity="0.3"/>
  <!-- Back panel (flush with left wall, starting near x=115) -->
  <polygon points="115,120 255,50 255,215 115,285" fill="#654321"/>
  <!-- Left side panel -->
  <polygon points="115,120 132,128 132,293 115,285" fill="#5a3a1a"/>
  <!-- Right side panel -->
  <polygon points="255,50 272,58 272,223 255,215" fill="#5a3a1a"/>
  <!-- Top surface -->
  <polygon points="115,120 255,50 272,58 132,128" fill="#8a6a4a"/>
  <!-- Bottom surface -->
  <polygon points="115,285 255,215 272,223 132,293" fill="#7a5a3a"/>

  <!-- Shelf boards -->
  <!-- Shelf 1 -->
  <polygon points="115,150 255,80 272,88 132,158" fill="#7a5a3a"/>
  <!-- Shelf 2 -->
  <polygon points="115,190 255,120 272,128 132,198" fill="#7a5a3a"/>
  <!-- Shelf 3 -->
  <polygon points="115,235 255,165 272,173 132,243" fill="#7a5a3a"/>

