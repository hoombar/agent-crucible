  <polygon points="167,133 173,136 173,142 167,139" fill="#1A6B1A"/>
  <polygon points="161,136 167,133 173,136 167,139" fill="#2AAB2A"/>
  <!-- Book 4 - orange, tall -->
  <polygon points="174,139 174,124 182,120 182,135" fill="#FF8C00"/>
  <polygon points="182,120 190,124 190,139 182,135" fill="#CC7000"/>
  <polygon points="174,124 182,120 190,124 182,128" fill="#FFAA30"/>
  <!-- Book 5 - purple -->
  <polygon points="191,135 191,122 197,119 197,132" fill="#9932CC"/>
  <polygon points="197,119 203,122 203,135 197,132" fill="#7728A0"/>
  <polygon points="191,122 197,119 203,122 197,125" fill="#B040E0"/>
  <!-- Book 6 - crimson -->
  <polygon points="204,132 204,121 210,118 210,129" fill="#DC143C"/>
  <polygon points="210,118 216,121 216,132 210,129" fill="#B01030"/>
  <polygon points="204,121 210,118 216,121 210,124" fill="#F02050"/>
  <!-- Book 7 - teal -->
  <polygon points="217,129 217,120 223,117 223,126" fill="#008080"/>
  <polygon points="223,117 229,120 229,129 223,126" fill="#006666"/>
  <polygon points="217,120 223,117 229,120 223,123" fill="#00A0A0"/>

  <!-- Books on middle shelf -->
  <!-- Book 8 - tomato -->
  <polygon points="127,190 127,174 135,170 135,186" fill="#FF6347"/>
  <polygon points="135,170 143,174 143,190 135,186" fill="#CC4F38"/>
  <polygon points="127,174 135,170 143,174 135,178" fill="#FF8060"/>
  <!-- Book 9 - sea green, tall -->
  <polygon points="144,186 144,168 152,164 152,182" fill="#2E8B57"/>
  <polygon points="152,164 160,168 160,186 152,182" fill="#246F45"/>
  <polygon points="144,168 152,164 160,168 152,172" fill="#38A568"/>
  <!-- Book 10 - goldenrod -->
  <polygon points="161,182 161,174 167,171 167,179" fill="#DAA520"/>
  <polygon points="167,171 173,174 173,182 167,179" fill="#B08418"/>
  <polygon points="161,174 167,171 173,174 167,177" fill="#EEBB38"/>
  <!-- Book 11 - blue violet, tall -->
  <polygon points="174,179 174,163 182,159 182,175" fill="#8A2BE2"/>
  <polygon points="182,159 190,163 190,179 182,175" fill="#6E22B5"/>
  <polygon points="174,163 182,159 190,163 182,167" fill="#A040F0"/>
  <!-- Book 12 - orange red -->
  <polygon points="191,175 191,165 197,162 197,172" fill="#FF4500"/>
  <polygon points="197,162 203,165 203,175 197,172" fill="#CC3700"/>
  <polygon points="191,165 197,162 203,165 197,168" fill="#FF6020"/>
  <!-- Book 13 - dark green, short -->
  <polygon points="204,172 204,167 210,164 210,169" fill="#006400"/>
  <polygon points="210,164 216,167 216,172 210,169" fill="#005000"/>
  <polygon points="204,167 210,164 216,167 210,170" fill="#008000"/>

  <!-- Books on bottom shelf -->
  <!-- Book 14 - firebrick -->
  <polygon points="127,235 127,218 135,214 135,231" fill="#B22222"/>
  <polygon points="135,214 143,218 143,235 135,231" fill="#8E1B1B"/>
  <polygon points="127,218 135,214 143,218 135,222" fill="#CC2A2A"/>
  <!-- Book 15 - steel blue, tall -->
  <polygon points="144,231 144,213 152,209 152,227" fill="#4682B4"/>
  <polygon points="152,209 160,213 160,231 152,227" fill="#386890"/>
  <polygon points="144,213 152,209 160,213 152,217" fill="#5698C8"/>
  <!-- Book 16 - gold, short -->
  <polygon points="161,227 161,221 167,218 167,224" fill="#FFD700"/>
  <polygon points="167,218 173,221 173,227 167,224" fill="#CCAC00"/>
  <polygon points="161,221 167,218 173,221 167,224" fill="#FFE540"/>
  <!-- Book 17 - purple -->
  <polygon points="174,224 174,210 182,206 182,220" fill="#800080"/>
  <polygon points="182,206 190,210 190,224 182,220" fill="#660066"/>
  <polygon points="174,210 182,206 190,210 182,214" fill="#990099"/>
  <!-- Book 18 - hot pink -->
  <polygon points="191,220 191,213 197,210 197,217" fill="#FF69B4"/>
  <polygon points="197,210 203,213 203,220 197,217" fill="#CC5490"/>
  <polygon points="191,213 197,210 203,213 197,216" fill="#FF80C0"/>
  <!-- Book 19 - navy -->
  <polygon points="204,217 204,204 212,200 212,213" fill="#000080"/>
  <polygon points="212,200 220,204 220,217 212,213" fill="#000060"/>
  <polygon points="204,204 212,200 220,204 212,208" fill="#0000A0"/>

  <!-- === DESK (right side) === -->
  <!-- Desk shadow on floor (isometric shape) -->
  <polygon points="480,340 545,372 630,335 565,303" fill="#000000" opacity="0.25"/>
  <!-- Desk top surface -->
  <polygon points="470,260 570,210 640,245 540,295" fill="#8B6914"/>
  <!-- Desk front face -->
  <polygon points="540,295 640,245 640,280 540,330" fill="#6B4F12"/>
  <!-- Desk left face -->
  <polygon points="470,260 540,295 540,330 470,295" fill="#7A5A13"/>
  <!-- Desk legs (equal height ~35px, proper isometric) -->
  <!-- Front-left leg -->
  <polygon points="470,295 477,299 477,334 470,330" fill="#5a3a10"/>
  <!-- Front-right leg -->
  <polygon points="633,280 640,280 640,315 633,315" fill="#5a3a10"/>
  <!-- Back-left leg -->
  <polygon points="470,260 477,264 477,299 470,295" fill="#5a3a10"/>
  <!-- Back-right leg -->
  <polygon points="633,245 640,245 640,280 633,280" fill="#4a2a08"/>

  <!-- === OPEN BOOK on desk (larger, V-shape) === -->
  <!-- Book cover underneath -->
  <polygon points="495,262 535,242 575,260 535,280" fill="#8B4513"/>
  <!-- Left page (angled up from spine) -->
  <polygon points="498,260 535,240 535,246 498,266" fill="#F5F5DC"/>
  <!-- Right page (angled up from spine) -->
  <polygon points="535,246 572,262 572,256 535,240" fill="#FFFFF0"/>
  <!-- Book spine -->
  <line x1="535" y1="240" x2="535" y2="246" stroke="#5a2d0a" stroke-width="2"/>
  <!-- Text lines on left page -->
  <line x1="504" y1="258" x2="530" y2="247" stroke="#888" stroke-width="0.6"/>
  <line x1="506" y1="261" x2="530" y2="250" stroke="#888" stroke-width="0.6"/>
  <line x1="504" y1="264" x2="528" y2="254" stroke="#888" stroke-width="0.6"/>
  <line x1="508" y1="266" x2="530" y2="257" stroke="#888" stroke-width="0.6"/>
  <!-- Text lines on right page -->
  <line x1="540" y1="247" x2="566" y2="258" stroke="#888" stroke-width="0.6"/>
  <line x1="540" y1="250" x2="564" y2="261" stroke="#888" stroke-width="0.6"/>
  <line x1="540" y1="254" x2="566" y2="264" stroke="#888" stroke-width="0.6"/>
  <line x1="540" y1="257" x2="564" y2="266" stroke="#888" stroke-width="0.6"/>

  <!-- === LAMP on desk === -->
  <!-- Lamp shadow on desk surface -->
  <ellipse cx="600" cy="238" rx="14" ry="5" fill="#000000" opacity="0.2"/>
  <!-- Lamp base (isometric ellipse) -->
  <ellipse cx="598" cy="233" rx="10" ry="5" fill="#B8860B"/>
  <!-- Lamp pole -->
  <line x1="598" y1="233" x2="598" y2="185" stroke="#B8860B" stroke-width="3"/>
  <!-- Lamp shade (isometric trapezoid with side faces) -->
  <polygon points="583,190 613,190 609,172 587,172" fill="#DAA520" opacity="0.9"/>
  <polygon points="609,172 616,176 616,193 613,190" fill="#B08418"/>
  <polygon points="587,172 583,190 579,187 582,170" fill="#C4961A"/>
  <!-- Lamp shade top (isometric ellipse) -->
  <ellipse cx="598" cy="172" rx="12" ry="4" fill="#C4961A"/>
  <!-- Lamp shade bottom opening -->
  <ellipse cx="598" cy="190" rx="15" ry="5" fill="#DAA520" opacity="0.5"/>
  <!-- Lamp bulb glow -->
  <ellipse cx="598" cy="183" rx="6" ry="3" fill="#FFFFE0" opacity="0.9"/>

  <!-- Light cone from lamp (follows isometric floor angle) -->
  <polygon points="583,190 520,310 560,330 620,330 660,310 613,190" fill="#FFD700" opacity="0.05"/>

  <!-- === WARM LAMP GLOW OVERLAY === -->
  <ellipse cx="560" cy="270" rx="220" ry="160" fill="url(#lampGlow)"/>

  <!-- Ambient warm overlay -->
  <rect width="800" height="600" fill="#FF8C00" opacity="0.04"/>

  <!-- Warm light on right wall near lamp -->
  <polygon points="400,110 700,280 700,180 400,10" fill="#FFA050" opacity="0.06"/>
</svg>