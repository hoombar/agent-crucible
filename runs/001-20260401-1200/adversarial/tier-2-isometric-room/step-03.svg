<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Warm lamp glow gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFA500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </radialGradient>
    <!-- Night sky gradient -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B3B"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <!-- Moon crescent clip path -->
    <clipPath id="moonClip">
      <circle cx="588" cy="108" r="10"/>
    </clipPath>
    <!-- Shadow filter for soft shadows -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="4" dy="6" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Warm wall gradient for left wall (near lamp light) -->
    <linearGradient id="leftWallGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d4c35"/>
      <stop offset="100%" stop-color="#4a3020"/>
    </linearGradient>
    <!-- Warm wall gradient for right wall (lamp side) -->
    <linearGradient id="rightWallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="60%" stop-color="#6d4830"/>
      <stop offset="100%" stop-color="#4a3228"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#12101a"/>

  <!-- === ROOM STRUCTURE (Isometric) === -->
  <!-- Floor -->
  <polygon points="400,450 100,280 400,110 700,280" fill="#3d2b1f"/>
  <!-- Left wall with warm gradient -->
  <polygon points="100,280 400,110 400,10 100,180" fill="url(#leftWallGrad)"/>
  <!-- Right wall with warm gradient -->
  <polygon points="400,110 700,280 700,180 400,10" fill="url(#rightWallGrad)"/>

  <!-- === RUG on floor === -->
  <polygon points="400,340 260,270 400,195 540,270" fill="#7a3c1e" opacity="0.9"/>
  <!-- Rug geometric pattern - concentric diamonds -->
  <polygon points="400,325 285,275 400,215 515,275" fill="#9c5030"/>
  <polygon points="400,310 310,275 400,235 490,275" fill="#b86840"/>
  <polygon points="400,295 340,275 400,255 460,275" fill="#cc8855"/>
  <!-- Rug border lines -->
  <line x1="260" y1="270" x2="400" y2="195" stroke="#5a2810" stroke-width="2"/>
  <line x1="400" y1="195" x2="540" y2="270" stroke="#5a2810" stroke-width="2"/>
  <line x1="540" y1="270" x2="400" y2="340" stroke="#5a2810" stroke-width="2"/>
  <line x1="400" y1="340" x2="260" y2="270" stroke="#5a2810" stroke-width="2"/>
  <!-- Rug inner diamond border -->
  <line x1="285" y1="275" x2="400" y2="215" stroke="#5a2810" stroke-width="1"/>
  <line x1="400" y1="215" x2="515" y2="275" stroke="#5a2810" stroke-width="1"/>
  <line x1="515" y1="275" x2="400" y2="325" stroke="#5a2810" stroke-width="1"/>
  <line x1="400" y1="325" x2="285" y2="275" stroke="#5a2810" stroke-width="1"/>

  <!-- === WINDOW on right wall === -->
  <!-- Window frame -->
  <polygon points="525,65 645,125 645,225 525,165" fill="#2a1f1a" stroke="#8B7355" stroke-width="3"/>
  <!-- Window glass - night sky -->
  <polygon points="530,70 640,128 640,220 530,162" fill="url(#nightSky)"/>
  <!-- Stars -->
  <circle cx="555" cy="100" r="1.5" fill="#FFFFFF"/>
  <circle cx="575" cy="90" r="1" fill="#FFFFFF"/>
  <circle cx="610" cy="108" r="1.5" fill="#FFFFFF"/>
  <circle cx="625" cy="140" r="1" fill="#FFFFFF"/>
  <circle cx="565" cy="125" r="1" fill="#FFFFFF"/>
  <circle cx="600" cy="145" r="1.2" fill="#FFFFFF"/>
  <circle cx="548" cy="140" r="0.8" fill="#FFFFFF"/>
  <circle cx="620" cy="160" r="1" fill="#FFFFFF"/>
  <circle cx="560" cy="152" r="0.7" fill="#FFFFFF"/>
  <circle cx="608" cy="170" r="0.9" fill="#FFFFFF"/>
  <!-- Crescent Moon using clip path -->
  <g clip-path="url(#moonClip)">
    <circle cx="588" cy="108" r="10" fill="#F0E68C"/>
    <circle cx="594" cy="104" r="9" fill="#0B0B3B"/>
  </g>
  <!-- Window mullion - vertical (isometric polygon following right wall angle) -->
  <polygon points="584,70 588,72 588,218 584,216" fill="#8B7355"/>
  <!-- Window mullion - horizontal -->
  <polygon points="530,115 640,173 640,177 530,119" fill="#8B7355"/>

  <!-- === BOOKSHELF on left wall === -->
  <!-- Bookshelf floor shadow -->
  <polygon points="170,275 185,283 290,225 275,218" fill="#000000" opacity="0.25"/>
  <!-- Bookshelf structure -->
  <!-- Back panel -->
  <polygon points="160,100 285,35 285,195 160,260" fill="#654321"/>
  <!-- Left side panel -->
  <polygon points="160,100 175,108 175,268 160,260" fill="#5a3a1a"/>
  <!-- Right side panel -->
  <polygon points="285,35 300,43 300,203 285,195" fill="#5a3a1a"/>
  <!-- Top surface (visible from above) -->
  <polygon points="160,100 285,35 300,43 175,108" fill="#8a6a4a"/>
  <!-- Bottom shelf surface -->
  <polygon points="160,260 285,195 300,203 175,268" fill="#7a5a3a"/>

  <!-- Shelf boards -->
  <!-- Shelf 1 (top) -->
  <polygon points="160,130 285,65 300,73 175,138" fill="#7a5a3a"/>
  <!-- Shelf 2 (middle) -->
  <polygon points="160,170 285,105 300,113 175,178" fill="#7a5a3a"/>
  <!-- Shelf 3 (bottom) -->
  <polygon points="160,215 285,150 300,158 175,223" fill="#7a5a3a"/>

  <!-- Books on top shelf (3D with top edges) -->
  <!-- Book 1 - red, tall -->
  <polygon points="170,130 170,112 178,108 178,126" fill="#C41E3A"/>
  <polygon points="178,108 186,112 186,130 178,126" fill="#A0182E"/>
  <polygon points="170,112 178,108 186,112 178,116" fill="#E8304A"/>
  <!-- Book 2 - blue -->
  <polygon points="187,126 187,110 195,106 195,122" fill="#1E90FF"/>
  <polygon points="195,106 203,110 203,126 195,122" fill="#1670CC"/>
  <polygon points="187,110 195,106 203,110 195,114" fill="#3AA0FF"/>
  <!-- Book 3 - green, short -->
  <polygon points="204,122 204,114 210,111 210,119" fill="#228B22"/>
  <polygon points="210,111 216,114 216,122 210,119" fill="#1A6B1A"/>
  <polygon points="204,114 210,111 216,114 210,117" fill="#2AAB2A"/>
  <!-- Book 4 - orange -->
  <polygon points="217,119 217,106 225,102 225,115" fill="#FF8C00"/>
  <polygon points="225,102 233,106 233,119 225,115" fill="#CC7000"/>
  <polygon points="217,106 225,102 233,106 225,110" fill="#FFAA30"/>
  <!-- Book 5 - purple, tall -->
  <polygon points="234,115 234,98 240,95 240,112" fill="#9932CC"/>
  <polygon points="240,95 246,98 246,115 240,112" fill="#7728A0"/>
  <polygon points="234,98 240,95 246,98 240,101" fill="#B040E0"/>
  <!-- Book 6 - crimson -->
  <polygon points="247,112 247,100 253,97 253,109" fill="#DC143C"/>
  <polygon points="253,97 259,100 259,112 253,109" fill="#B01030"/>
  <polygon points="247,100 253,97 259,100 253,103" fill="#F02050"/>

  <!-- Books on middle shelf (3D with top edges) -->
  <!-- Book 7 - tomato -->
  <polygon points="170,170 170,155 178,151 178,166" fill="#FF6347"/>
  <polygon points="178,151 186,155 186,170 178,166" fill="#CC4F38"/>
  <polygon points="170,155 178,151 186,155 178,159" fill="#FF8060"/>
  <!-- Book 8 - sea green, tall -->
  <polygon points="187,166 187,148 195,144 195,162" fill="#2E8B57"/>
  <polygon points="195,144 203,148 203,166 195,162" fill="#246F45"/>
  <polygon points="187,148 195,144 203,148 195,152" fill="#38A568"/>
  <!-- Book 9 - goldenrod -->
  <polygon points="204,162 204,152 210,149 210,159" fill="#DAA520"/>
  <polygon points="210,149 216,152 216,162 210,159" fill="#B08418"/>
  <polygon points="204,152 210,149 216,152 210,155" fill="#EEBB38"/>
  <!-- Book 10 - blue violet -->
  <polygon points="217,159 217,147 225,143 225,155" fill="#8A2BE2"/>
  <polygon points="225,143 233,147 233,159 225,155" fill="#6E22B5"/>
  <polygon points="217,147 225,143 233,147 225,151" fill="#A040F0"/>
  <!-- Book 11 - orange red -->
  <polygon points="234,155 234,142 242,138 242,151" fill="#FF4500"/>
  <polygon points="242,138 250,142 250,155 242,151" fill="#CC3700"/>
  <polygon points="234,142 242,138 250,142 242,146" fill="#FF6020"/>
  <!-- Book 12 - dark green, short -->
  <polygon points="251,151 251,145 257,142 257,148" fill="#006400"/>
  <polygon points="257,142 263,145 263,151 257,148" fill="#005000"/>
  <polygon points="251,145 257,142 263,145 257,148" fill="#008000"/>

  <!-- Books on bottom shelf -->
  <!-- Book 13 - firebrick -->
  <polygon points="170,215 170,198 178,194 178,211" fill="#B22222"/>
  <polygon points="178,194 186,198 186,215 178,211" fill="#8E1B1B"/>
  <polygon points="170,198 178,194 186,198 178,202" fill="#CC2A2A"/>
  <!-- Book 14 - steel blue -->
  <polygon points="187,211 187,197 195,193 195,207" fill="#4682B4"/>
  <polygon points="195,193 203,197 203,211 195,207" fill="#386890"/>
  <polygon points="187,197 195,193 203,197 195,201" fill="#5698C8"/>
  <!-- Book 15 - gold, short -->
  <polygon points="204,207 204,200 210,197 210,204" fill="#FFD700"/>
  <polygon points="210,197 216,200 216,207 210,204" fill="#CCAC00"/>
  <polygon points="204,200 210,197 216,200 210,203" fill="#FFE540"/>
  <!-- Book 16 - purple -->
  <polygon points="217,204 217,190 225,186 225,200" fill="#800080"/>
  <polygon points="225,186 233,190 233,204 225,200" fill="#660066"/>
  <polygon points="217,190 225,186 233,190 225,194" fill="#990099"/>
  <!-- Book 17 - hot pink -->
  <polygon points="234,200 234,192 240,189 240,197" fill="#FF69B4"/>
  <polygon points="240,189 246,192 246,200 240,197" fill="#CC5490"/>
  <polygon points="234,192 240,189 246,192 240,195" fill="#FF80C0"/>
  <!-- Book 18 - teal -->
  <polygon points="247,197 247,185 255,181 255,193" fill="#008080"/>
  <polygon points="255,181 263,185 263,197 255,193" fill="#006666"/>
  <polygon points="247,185 255,181 263,185 255,189" fill="#00A0A0"/>

  <!-- === DESK (right side, slightly smaller) === -->
  <!-- Desk shadow on floor -->
  <polygon points="490,340 540,365 620,330 570,305" fill="#000000" opacity="0.25"/>
  <!-- Desk top surface (isometric parallelogram) -->
  <polygon points="470,260 570,210 635,242 535,292" fill="#8B6914"/>
  <!-- Desk front face -->
  <polygon points="535,292 635,242 635,275 535,325" fill="#6B4F12"/>
  <!-- Desk left face -->
  <polygon points="470,260 535,292 535,325 470,293" fill="#7A5A13"/>
  <!-- Desk front-left leg -->
  <polygon points="470,293 476,296 476,328 470,325" fill="#5a3a10"/>
  <!-- Desk front-right leg -->
  <polygon points="629,275 635,275 635,305 629,305" fill="#5a3a10"/>
  <!-- Desk back-left leg -->
  <polygon points="470,260 476,263 476,285 470,282" fill="#5a3a10"/>
  <!-- Desk back-right leg -->
  <polygon points="629,242 635,242 635,265 629,265" fill="#5a3a10"/>

  <!-- === OPEN BOOK on desk === -->
  <!-- Book cover/base -->
  <polygon points="505,255 535,240 565,253 535,268" fill="#8B4513"/>
  <!-- Left page -->
  <polygon points="508,253 535,238 535,242 508,257" fill="#F5F5DC"/>
  <!-- Right page -->
  <polygon points="535,242 562,255 562,251 535,238" fill="#FFFFF0"/>
  <!-- Book spine shadow -->
  <line x1="535" y1="238" x2="535" y2="242" stroke="#5a2d0a" stroke-width="1.5"/>
  <!-- Text lines on left page -->
  <line x1="513" y1="250" x2="530" y2="243" stroke="#888" stroke-width="0.5"/>
  <line x1="513" y1="252" x2="528" y2="246" stroke="#888" stroke-width="0.5"/>
  <line x1="515" y1="254" x2="530" y2="248" stroke="#888" stroke-width="0.5"/>
  <!-- Text lines on right page -->
  <line x1="540" y1="243" x2="557" y2="250" stroke="#888" stroke-width="0.5"/>
  <line x1="540" y1="246" x2="555" y2="252" stroke="#888" stroke-width="0.5"/>
  <line x1="540" y1="248" x2="557" y2="254" stroke="#888" stroke-width="0.5"/>

  <!-- === LAMP on desk === -->
  <!-- Lamp base (isometric ellipse) -->
  <ellipse cx="595" cy="228" rx="10" ry="5" fill="#B8860B"/>
  <!-- Lamp pole -->
  <line x1="595" y1="228" x2="595" y2="185" stroke="#B8860B" stroke-width="3"/>
  <!-- Lamp shade (isometric - tilted trapezoid) -->
  <polygon points="580,188 610,188 607,172 583,172" fill="#DAA520" opacity="0.9"/>
  <polygon points="607,172 613,175 613,190 610,188" fill="#B08418"/>
  <polygon points="583,172 580,188 577,186 580,170" fill="#C4961A"/>
  <!-- Lamp shade top (isometric ellipse) -->
  <ellipse cx="595" cy="172" rx="12" ry="4" fill="#C4961A"/>
  <!-- Lamp shade bottom opening -->
  <ellipse cx="595" cy="188" rx="15" ry="5" fill="#DAA520" opacity="0.5"/>
  <!-- Lamp bulb glow -->
  <ellipse cx="595" cy="182" rx="6" ry="3" fill="#FFFFE0" opacity="0.9"/>
  <!-- Light cone from lamp -->
  <polygon points="580,188 530,280 660,280 610,188" fill="#FFD700" opacity="0.06"/>

  <!-- === WARM LAMP GLOW OVERLAY === -->
  <ellipse cx="560" cy="260" rx="220" ry="160" fill="url(#lampGlow)"/>

  <!-- === Ambient warm overlay for cozy feel === -->
  <rect width="800" height="600" fill="#FF8C00" opacity="0.04"/>

  <!-- Warm light on nearby wall section -->
  <polygon points="400,110 700,280 700,180 400,10" fill="#FFA050" opacity="0.06"/>
</svg>