<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Radial gradient for background atmosphere -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="60%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>

    <!-- Glow effect for centre -->
    <radialGradient id="centre-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e6a800" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>

    <!-- Petal gradient -->
    <linearGradient id="petal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7b2d8e"/>
      <stop offset="50%" stop-color="#c2185b"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>

    <!-- Outer petal gradient -->
    <linearGradient id="outer-petal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a148c"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>

    <!-- Triangle gradient -->
    <linearGradient id="tri-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow filter -->
    <filter id="outer-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Atmospheric background -->
  <rect width="800" height="800" fill="url(#bg-grad)"/>

  <!-- Subtle background glow ring -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="#7b1fa2" stroke-width="0.5" opacity="0.3"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="#c2185b" stroke-width="0.3" opacity="0.2"/>

  <!-- Decorative border: ornate double ring with glow -->
  <circle cx="400" cy="400" r="385" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.7" filter="url(#outer-glow)"/>
  <circle cx="400" cy="400" r="375" fill="none" stroke="#7b1fa2" stroke-width="3" stroke-dasharray="8 4"/>
  <circle cx="400" cy="400" r="365" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5"/>

  <!-- Border ornaments: 8 diamond shapes -->
  <g id="border-diamond">
    <polygon points="400,18 395,30 400,42 405,30" fill="#ffd700" opacity="0.8"/>
  </g>
  <use href="#border-diamond" transform="rotate(0 400 400)"/>
  <use href="#border-diamond" transform="rotate(45 400 400)"/>
  <use href="#border-diamond" transform="rotate(90 400 400)"/>
  <use href="#border-diamond" transform="rotate(135 400 400)"/>
  <use href="#border-diamond" transform="rotate(180 400 400)"/>
  <use href="#border-diamond" transform="rotate(225 400 400)"/>
  <use href="#border-diamond" transform="rotate(270 400 400)"/>
  <use href="#border-diamond" transform="rotate(315 400 400)"/>

  <!-- OUTER RING: Pointed/triangle elements with gradient and glow -->
  <g id="outer-point">
    <polygon points="400,55 380,130 400,110 420,130" fill="url(#tri-grad)" opacity="0.9"/>
    <polygon points="400,65 388,120 400,105 412,120" fill="#ffd700" opacity="0.4"/>
  </g>
  <use href="#outer-point" transform="rotate(0 400 400)"/>
  <use href="#outer-point" transform="rotate(45 400 400)"/>
  <use href="#outer-point" transform="rotate(90 400 400)"/>
  <use href="#outer-point" transform="rotate(135 400 400)"/>
  <use href="#outer-point" transform="rotate(180 400 400)"/>
  <use href="#outer-point" transform="rotate(225 400 400)"/>
  <use href="#outer-point" transform="rotate(270 400 400)"/>
  <use href="#outer-point" transform="rotate(315 400 400)"/>

  <!-- Outer ring connecting arcs -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#7b1fa2" stroke-width="1.5" opacity="0.4"/>
  <circle cx="400" cy="400" r="290" fill="none" stroke="#4a148c" stroke-width="0.8" opacity="0.3"/>

  <!-- MIDDLE RING: Petal/leaf shapes with gradients -->
  <g id="petal-main">
    <path d="M400,160 Q425,220 400,280 Q375,220 400,160 Z" fill="url(#petal-grad)" opacity="0.85"/>
    <path d="M400,170 Q418,220 400,270 Q382,220 400,170 Z" fill="#e91e63" opacity="0.3"/>
  </g>
  <use href="#petal-main" transform="rotate(0 400 400)"/>
  <use href="#petal-main" transform="rotate(45 400 400)"/>
  <use href="#petal-main" transform="rotate(90 400 400)"/>
  <use href="#petal-main" transform="rotate(135 400 400)"/>
  <use href="#petal-main" transform="rotate(180 400 400)"/>
  <use href="#petal-main" transform="rotate(225 400 400)"/>
  <use href="#petal-main" transform="rotate(270 400 400)"/>
  <use href="#petal-main" transform="rotate(315 400 400)"/>

  <!-- Secondary petals offset 22.5 degrees -->
  <g id="petal-secondary">
    <path d="M400,190 Q415,230 400,270 Q385,230 400,190 Z" fill="url(#outer-petal-grad)" opacity="0.6"/>
  </g>
  <use href="#petal-secondary" transform="rotate(22.5 400 400)"/>
  <use href="#petal-secondary" transform="rotate(67.5 400 400)"/>
  <use href="#petal-secondary" transform="rotate(112.5 400 400)"/>
  <use href="#petal-secondary" transform="rotate(157.5 400 400)"/>
  <use href="#petal-secondary" transform="rotate(202.5 400 400)"/>
  <use href="#petal-secondary" transform="rotate(247.5 400 400)"/>
  <use href="#petal-secondary" transform="rotate(292.5 400 400)"/>
  <use href="#petal-secondary" transform="rotate(337.5 400 400)"/>

  <!-- INNER RING: Circles/dots with glow effects -->
  <circle cx="400" cy="400" r="120" fill="none" stroke="#c2185b" stroke-width="1" opacity="0.3"/>

  <g id="inner-gem">
    <circle cx="400" cy="290" r="14" fill="#ffd700" opacity="0.8" filter="url(#soft-glow)"/>
    <circle cx="400" cy="290" r="9" fill="#ffecb3" opacity="0.6"/>
    <circle cx="400" cy="290" r="4" fill="#ffffff" opacity="0.9"/>
  </g>
  <use href="#inner-gem" transform="rotate(0 400 400)"/>
  <use href="#inner-gem" transform="rotate(45 400 400)"/>
  <use href="#inner-gem" transform="rotate(90 400 400)"/>
  <use href="#inner-gem" transform="rotate(135 400 400)"/>
  <use href="#inner-gem" transform="rotate(180 400 400)"/>
  <use href="#inner-gem" transform="rotate(225 400 400)"/>
  <use href="#inner-gem" transform="rotate(270 400 400)"/>
  <use href="#inner-gem" transform="rotate(315 400 400)"/>

  <!-- Small accent dots between inner gems -->
  <g id="accent-dot">
    <circle cx="400" cy="305" r="4" fill="#c2185b" opacity="0.6"/>
  </g>
  <use href="#accent-dot" transform="rotate(22.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(67.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(112.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(157.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(202.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(247.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(292.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(337.5 400 400)"/>

  <!-- Centre: radiant glow -->
  <circle cx="400" cy="400" r="70" fill="url(#centre-glow)" opacity="0.5"/>
  <circle cx="400" cy="400" r="45" fill="#4a148c" opacity="0.8"/>
  <circle cx="400" cy="400" r="35" fill="#7b1fa2" opacity="0.7"/>
  <circle cx="400" cy="400" r="22" fill="#c2185b" opacity="0.8"/>
  <circle cx="400" cy="400" r="12" fill="#ffd700" opacity="0.9"/>
  <circle cx="400" cy="400" r="5" fill="#ffffff" opacity="0.95"/>

  <!-- Centre starburst: thin lines radiating out -->
  <g id="starburst-line">
    <line x1="400" y1="355" x2="400" y2="340" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
  </g>
  <use href="#starburst-line" transform="rotate(0 400 400)"/>
  <use href="#starburst-line" transform="rotate(22.5 400 400)"/>
  <use href="#starburst-line" transform="rotate(45 400 400)"/>
  <use href="#starburst-line" transform="rotate(67.5 400 400)"/>
  <use href="#starburst-line" transform="rotate(90 400 400)"/>
  <use href="#starburst-line" transform="rotate(112.5 400 400)"/>
  <use href="#starburst-line" transform="rotate(135 400 400)"/>
  <use href="#starburst-line" transform="rotate(157.5 400 400)"/>
  <use href="#starburst-line" transform="rotate(180 400 400)"/>
  <use href="#starburst-line" transform="rotate(202.5 400 400)"/>
  <use href="#starburst-line" transform="rotate(225 400 400)"/>
  <use href="#starburst-line" transform="rotate(247.5 400 400)"/>
  <use href="#starburst-line" transform="rotate(270 400 400)"/>
  <use href="#starburst-line" transform="rotate(292.5 400 400)"/>
  <use href="#starburst-line" transform="rotate(315 400 400)"/>
  <use href="#starburst-line" transform="rotate(337.5 400 400)"/>
</svg>