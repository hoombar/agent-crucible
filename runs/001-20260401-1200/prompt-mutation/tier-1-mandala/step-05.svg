<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background atmosphere -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="60%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>

    <!-- Centre glow -->
    <radialGradient id="centre-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e6a800" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>

    <!-- Petal gradient -->
    <linearGradient id="petal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7b2d8e"/>
      <stop offset="50%" stop-color="#c2185b"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>

    <!-- Secondary petal gradient -->
    <linearGradient id="petal-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a148c"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>

    <!-- Triangle gradient -->
    <linearGradient id="tri-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Warm amber gradient for connecting elements (NEW) -->
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>

    <!-- Inner gem radial gradient -->
    <radialGradient id="gem-grad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffecb3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Soft glow filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow filter -->
    <filter id="outer-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Atmospheric background -->
  <rect width="800" height="800" fill="url(#bg-grad)"/>

  <!-- Subtle ambient ring behind everything -->
  <circle cx="400" cy="400" r="370" fill="none" stroke="#7b1fa2" stroke-width="0.5" opacity="0.15"/>

  <!-- === DECORATIVE BORDER === -->
  <circle cx="400" cy="400" r="392" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.5" filter="url(#outer-glow)"/>
  <circle cx="400" cy="400" r="382" fill="none" stroke="#7b1fa2" stroke-width="2.5"/>
  <circle cx="400" cy="400" r="377" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.35"/>

  <!-- 32 border ticks -->
  <g id="border-tick">
    <line x1="400" y1="10" x2="400" y2="24" stroke="#ffd700" stroke-width="1.2" opacity="0.6"/>
  </g>
  <use href="#border-tick" transform="rotate(0 400 400)"/>
  <use href="#border-tick" transform="rotate(11.25 400 400)"/>
  <use href="#border-tick" transform="rotate(22.5 400 400)"/>
  <use href="#border-tick" transform="rotate(33.75 400 400)"/>
  <use href="#border-tick" transform="rotate(45 400 400)"/>
  <use href="#border-tick" transform="rotate(56.25 400 400)"/>
  <use href="#border-tick" transform="rotate(67.5 400 400)"/>
  <use href="#border-tick" transform="rotate(78.75 400 400)"/>
  <use href="#border-tick" transform="rotate(90 400 400)"/>
  <use href="#border-tick" transform="rotate(101.25 400 400)"/>
  <use href="#border-tick" transform="rotate(112.5 400 400)"/>
  <use href="#border-tick" transform="rotate(123.75 400 400)"/>
  <use href="#border-tick" transform="rotate(135 400 400)"/>
  <use href="#border-tick" transform="rotate(146.25 400 400)"/>
  <use href="#border-tick" transform="rotate(157.5 400 400)"/>
  <use href="#border-tick" transform="rotate(168.75 400 400)"/>
  <use href="#border-tick" transform="rotate(180 400 400)"/>
  <use href="#border-tick" transform="rotate(191.25 400 400)"/>
  <use href="#border-tick" transform="rotate(202.5 400 400)"/>
  <use href="#border-tick" transform="rotate(213.75 400 400)"/>
  <use href="#border-tick" transform="rotate(225 400 400)"/>
  <use href="#border-tick" transform="rotate(236.25 400 400)"/>
  <use href="#border-tick" transform="rotate(247.5 400 400)"/>
  <use href="#border-tick" transform="rotate(258.75 400 400)"/>
  <use href="#border-tick" transform="rotate(270 400 400)"/>
  <use href="#border-tick" transform="rotate(281.25 400 400)"/>
  <use href="#border-tick" transform="rotate(292.5 400 400)"/>
  <use href="#border-tick" transform="rotate(303.75 400 400)"/>
  <use href="#border-tick" transform="rotate(315 400 400)"/>
  <use href="#border-tick" transform="rotate(326.25 400 400)"/>
  <use href="#border-tick" transform="rotate(337.5 400 400)"/>
  <use href="#border-tick" transform="rotate(348.75 400 400)"/>

  <!-- 8 diamond ornaments on border -->
  <g id="border-diamond">
    <polygon points="400,3 395,18 400,33 405,18" fill="#ffd700" opacity="0.85"/>
  </g>
  <use href="#border-diamond" transform="rotate(0 400 400)"/>
  <use href="#border-diamond" transform="rotate(45 400 400)"/>
  <use href="#border-diamond" transform="rotate(90 400 400)"/>
  <use href="#border-diamond" transform="rotate(135 400 400)"/>
  <use href="#border-diamond" transform="rotate(180 400 400)"/>
  <use href="#border-diamond" transform="rotate(225 400 400)"/>
  <use href="#border-diamond" transform="rotate(270 400 400)"/>
  <use href="#border-diamond" transform="rotate(315 400 400)"/>

  <!-- === OUTER RING: Triangles/pointed elements === -->
  <g id="outer-point">
    <polygon points="400,48 376,132 400,112 424,132" fill="url(#tri-grad)" opacity="0.9"/>
    <polygon points="400,62 388,124 400,108 412,124" fill="#ffd700" opacity="0.25"/>
  </g>
  <use href="#outer-point" transform="rotate(0 400 400)"/>
  <use href="#outer-point" transform="rotate(45 400 400)"/>
  <use href="#outer-point" transform="rotate(90 400 400)"/>
  <use href="#outer-point" transform="rotate(135 400 400)"/>
  <use href="#outer-point" transform="rotate(180 400 400)"/>
  <use href="#outer-point" transform="rotate(225 400 400)"/>
  <use href="#outer-point" transform="rotate(270 400 400)"/>
  <use href="#outer-point" transform="rotate(315 400 400)"/>

  <!-- Secondary smaller points offset 22.5 degrees -->
  <g id="outer-tri-sm">
    <polygon points="400,72 392,118 400,108 408,118" fill="#7b1fa2" opacity="0.6"/>
  </g>
  <use href="#outer-tri-sm" transform="rotate(22.5 400 400)"/>
  <use href="#outer-tri-sm" transform="rotate(67.5 400 400)"/>
  <use href="#outer-tri-sm" transform="rotate(112.5 400 400)"/>
  <use href="#outer-tri-sm" transform="rotate(157.5 400 400)"/>
  <use href="#outer-tri-sm" transform="rotate(202.5 400 400)"/>
  <use href="#outer-tri-sm" transform="rotate(247.5 400 400)"/>
  <use href="#outer-tri-sm" transform="rotate(292.5 400 400)"/>
  <use href="#outer-tri-sm" transform="rotate(337.5 400 400)"/>

  <!-- NEW: Connecting teardrops between outer and middle rings -->
  <g id="connector-drop">
    <path d="M400,130 Q405,142 400,155 Q395,142 400,130 Z" fill="url(#amber-grad)" opacity="0.5"/>
  </g>
  <use href="#connector-drop" transform="rotate(0 400 400)"/>
  <use href="#connector-drop" transform="rotate(45 400 400)"/>
  <use href="#connector-drop" transform="rotate(90 400 400)"/>
  <use href="#connector-drop" transform="rotate(135 400 400)"/>
  <use href="#connector-drop" transform="rotate(180 400 400)"/>
  <use href="#connector-drop" transform="rotate(225 400 400)"/>
  <use href="#connector-drop" transform="rotate(270 400 400)"/>
  <use href="#connector-drop" transform="rotate(315 400 400)"/>

  <!-- Transition ring between outer and middle -->
  <circle cx="400" cy="400" r="265" fill="none" stroke="#7b1fa2" stroke-width="1" stroke-dasharray="6 3" opacity="0.3"/>

  <!-- === MIDDLE RING: Petals/leaf shapes === -->
  <g id="petal-main">
    <path d="M400,140 Q435,220 400,300 Q365,220 400,140 Z" fill="url(#petal-grad)" opacity="0.85"/>
    <path d="M400,158 Q425,222 400,286 Q375,222 400,158 Z" fill="#e91e63" opacity="0.2"/>
  </g>
  <use href="#petal-main" transform="rotate(0 400 400)"/>
  <use href="#petal-main" transform="rotate(45 400 400)"/>
  <use href="#petal-main" transform="rotate(90 400 400)"/>
  <use href="#petal-main" transform="rotate(135 400 400)"/>
  <use href="#petal-main" transform="rotate(180 400 400)"/>
  <use href="#petal-main" transform="rotate(225 400 400)"/>
  <use href="#petal-main" transform="rotate(270 400 400)"/>
  <use href="#petal-main" transform="rotate(315 400 400)"/>

  <!-- Secondary petals offset 22.5 degrees -->
  <g id="petal-sm">
    <path d="M400,175 Q420,235 400,295 Q380,235 400,175 Z" fill="url(#petal-grad-2)" opacity="0.5"/>
  </g>
  <use href="#petal-sm" transform="rotate(22.5 400 400)"/>
  <use href="#petal-sm" transform="rotate(67.5 400 400)"/>
  <use href="#petal-sm" transform="rotate(112.5 400 400)"/>
  <use href="#petal-sm" transform="rotate(157.5 400 400)"/>
  <use href="#petal-sm" transform="rotate(202.5 400 400)"/>
  <use href="#petal-sm" transform="rotate(247.5 400 400)"/>
  <use href="#petal-sm" transform="rotate(292.5 400 400)"/>
  <use href="#petal-sm" transform="rotate(337.5 400 400)"/>

  <!-- Transition ring between middle and inner -->
  <circle cx="400" cy="400" r="130" fill="none" stroke="#4a148c" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>

  <!-- === INNER RING: Circles/dots === -->
  <!-- Primary gem dots -->
  <g id="inner-gem">
    <circle cx="400" cy="275" r="15" fill="url(#gem-grad)" filter="url(#soft-glow)"/>
  </g>
  <use href="#inner-gem" transform="rotate(0 400 400)"/>
  <use href="#inner-gem" transform="rotate(45 400 400)"/>
  <use href="#inner-gem" transform="rotate(90 400 400)"/>
  <use href="#inner-gem" transform="rotate(135 400 400)"/>
  <use href="#inner-gem" transform="rotate(180 400 400)"/>
  <use href="#inner-gem" transform="rotate(225 400 400)"/>
  <use href="#inner-gem" transform="rotate(270 400 400)"/>
  <use href="#inner-gem" transform="rotate(315 400 400)"/>

  <!-- Dot chain toward centre -->
  <g id="inner-chain">
    <circle cx="400" cy="298" r="5" fill="#c2185b" opacity="0.6"/>
    <circle cx="400" cy="314" r="3" fill="#7b1fa2" opacity="0.45"/>
  </g>
  <use href="#inner-chain" transform="rotate(0 400 400)"/>
  <use href="#inner-chain" transform="rotate(45 400 400)"/>
  <use href="#inner-chain" transform="rotate(90 400 400)"/>
  <use href="#inner-chain" transform="rotate(135 400 400)"/>
  <use href="#inner-chain" transform="rotate(180 400 400)"/>
  <use href="#inner-chain" transform="rotate(225 400 400)"/>
  <use href="#inner-chain" transform="rotate(270 400 400)"/>
  <use href="#inner-chain" transform="rotate(315 400 400)"/>

  <!-- Interstitial accent dots -->
  <g id="accent-dot">
    <circle cx="400" cy="288" r="3.5" fill="#ffd700" opacity="0.4"/>
  </g>
  <use href="#accent-dot" transform="rotate(22.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(67.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(112.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(157.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(202.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(247.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(292.5 400 400)"/>
  <use href="#accent-dot" transform="rotate(337.5 400 400)"/>

  <!-- Inner ring guide -->
  <circle cx="400" cy="400" r="92" fill="none" stroke="#4a148c" stroke-width="0.5" opacity="0.2"/>

  <!-- === CENTRE === -->
  <circle cx="400" cy="400" r="72" fill="url(#centre-glow)" opacity="0.4"/>
  <circle cx="400" cy="400" r="50" fill="#4a148c" opacity="0.85"/>
  <circle cx="400" cy="400" r="40" fill="#7b1fa2" opacity="0.75"/>
  <circle cx="400" cy="400" r="28" fill="#c2185b" opacity="0.8"/>
  <circle cx="400" cy="400" r="16" fill="#ffd700" opacity="0.9"/>
  <circle cx="400" cy="400" r="7" fill="#ffffff" opacity="0.95"/>

  <!-- Centre dot ring -->
  <g id="centre-dot">
    <circle cx="400" cy="336" r="5" fill="#ffd700" opacity="0.6"/>
  </g>
  <use href="#centre-dot" transform="rotate(0 400 400)"/>
  <use href="#centre-dot" transform="rotate(45 400 400)"/>
  <use href="#centre-dot" transform="rotate(90 400 400)"/>
  <use href="#centre-dot" transform="rotate(135 400 400)"/>
  <use href="#centre-dot" transform="rotate(180 400 400)"/>
  <use href="#centre-dot" transform="rotate(225 400 400)"/>
  <use href="#centre-dot" transform="rotate(270 400 400)"/>
  <use href="#centre-dot" transform="rotate(315 400 400)"/>

  <!-- NEW: Small rose dots between centre dots for density -->
  <g id="centre-dot-sm">
    <circle cx="400" cy="342" r="2.5" fill="#c2185b" opacity="0.4"/>
  </g>
  <use href="#centre-dot-sm" transform="rotate(22.5 400 400)"/>
  <use href="#centre-dot-sm" transform="rotate(67.5 400 400)"/>
  <use href="#centre-dot-sm" transform="rotate(112.5 400 400)"/>
  <use href="#centre-dot-sm" transform="rotate(157.5 400 400)"/>
  <use href="#centre-dot-sm" transform="rotate(202.5 400 400)"/>
  <use href="#centre-dot-sm" transform="rotate(247.5 400 400)"/>
  <use href="#centre-dot-sm" transform="rotate(292.5 400 400)"/>
  <use href="#centre-dot-sm" transform="rotate(337.5 400 400)"/>

  <!-- Centre starburst -->
  <g id="starburst">
    <line x1="400" y1="350" x2="400" y2="332" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  </g>
  <use href="#starburst" transform="rotate(0 400 400)"/>
  <use href="#starburst" transform="rotate(22.5 400 400)"/>
  <use href="#starburst" transform="rotate(45 400 400)"/>
  <use href="#starburst" transform="rotate(67.5 400 400)"/>
  <use href="#starburst" transform="rotate(90 400 400)"/>
  <use href="#starburst" transform="rotate(112.5 400 400)"/>
  <use href="#starburst" transform="rotate(135 400 400)"/>
  <use href="#starburst" transform="rotate(157.5 400 400)"/>
  <use href="#starburst" transform="rotate(180 400 400)"/>
  <use href="#starburst" transform="rotate(202.5 400 400)"/>
  <use href="#starburst" transform="rotate(225 400 400)"/>
  <use href="#starburst" transform="rotate(247.5 400 400)"/>
  <use href="#starburst" transform="rotate(270 400 400)"/>
  <use href="#starburst" transform="rotate(292.5 400 400)"/>
  <use href="#starburst" transform="rotate(315 400 400)"/>
  <use href="#starburst" transform="rotate(337.5 400 400)"/>
</svg>