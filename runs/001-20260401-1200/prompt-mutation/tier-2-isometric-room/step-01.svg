<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Isometric transform helpers: 30-degree projection -->
    <!-- Isometric axes: x-axis goes right-down at 30deg, y-axis goes left-down at 30deg, z-axis goes straight up -->
    <filter id="shadow-m1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="3" dy="5" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lamp-glow-m1">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#2a2a3a"/>

  <!-- ROOM STRUCTURE - Isometric room with two walls and floor -->
  <!-- Floor: parallelogram in isometric view -->
  <polygon points="400,450 650,325 400,200 150,325" fill="#5c4a3a" stroke="#4a3a2a" stroke-width="1"/>

  <!-- Left wall -->
  <polygon points="150,325 400,200 400,50 150,175" fill="#6b5b4b" stroke="#4a3a2a" stroke-width="1"/>

  <!-- Right wall -->
  <polygon points="400,200 650,325 650,175 400,50" fill="#7a6a5a" stroke="#4a3a2a" stroke-width="1"/>

  <!-- Floor grid lines for structural precision -->
  <g stroke="#4a3a2a" stroke-width="0.5" opacity="0.3">
    <!-- Lines parallel to left wall base -->
    <line x1="200" y1="350" x2="450" y2="225"/>
    <line x1="250" y1="375" x2="500" y2="250"/>
    <line x1="300" y1="400" x2="550" y2="275"/>
    <line x1="350" y1="425" x2="600" y2="300"/>
    <!-- Lines parallel to right wall base -->
    <line x1="200" y1="250" x2="450" y2="375"/>
    <line x1="250" y1="225" x2="500" y2="350"/>
    <line x1="300" y1="250" x2="550" y2="375"/>
    <line x1="350" y1="225" x2="600" y2="350"/>
  </g>

  <!-- RUG on floor - geometric diamond pattern -->
  <g>
    <!-- Rug base shape (isometric rectangle on floor) -->
    <polygon points="320,380 450,315 380,280 250,345" fill="#8b4a4a" opacity="0.8"/>
    <!-- Rug border -->
    <polygon points="320,380 450,315 380,280 250,345" fill="none" stroke="#a06040" stroke-width="2"/>
    <!-- Inner diamond pattern -->
    <polygon points="320,360 420,310 370,285 270,335" fill="none" stroke="#c08060" stroke-width="1.5"/>
    <polygon points="320,345 395,307 360,290 285,328" fill="none" stroke="#d09070" stroke-width="1"/>
    <!-- Center diamond -->
    <polygon points="320,335 370,310 345,298 295,323" fill="#a06040" opacity="0.5"/>
  </g>

  <!-- BOOKSHELF on left wall -->
  <g filter="url(#shadow-m1)">
    <!-- Bookshelf back (on left wall) -->
    <polygon points="175,300 280,245 280,130 175,185" fill="#6b4226"/>
    <!-- Bookshelf side (right face, isometric) -->
    <polygon points="280,245 310,260 310,145 280,130" fill="#5a3520"/>
    <!-- Bookshelf top -->
    <polygon points="175,185 280,130 310,145 205,200" fill="#7a5236"/>

    <!-- Shelf boards -->
    <line x1="175" y1="222" x2="280" y2="167" stroke="#5a3520" stroke-width="2"/>
    <line x1="280" y1="167" x2="310" y2="182" stroke="#4a2a18" stroke-width="2"/>
    <line x1="175" y1="260" x2="280" y2="205" stroke="#5a3520" stroke-width="2"/>
    <line x1="280" y1="205" x2="310" y2="220" stroke="#4a2a18" stroke-width="2"/>

    <!-- Books on top shelf (6+ books with varying heights) -->
    <!-- Book 1 - tall, red -->
    <polygon points="185,220 195,215 195,188 185,193" fill="#c04040"/>
    <!-- Book 2 - medium, blue -->
    <polygon points="198,214 208,209 208,190 198,195" fill="#4060c0"/>
    <!-- Book 3 - short, green -->
    <polygon points="211,208 219,204 219,193 211,197" fill="#40a040"/>
    <!-- Book 4 - tall, purple -->
    <polygon points="222,203 232,198 232,170 222,175" fill="#8040a0"/>
    <!-- Book 5 - medium, orange -->
    <polygon points="235,197 245,192 245,178 235,183" fill="#d08030"/>
    <!-- Book 6 - medium, teal -->
    <polygon points="248,191 258,186 258,172 248,177" fill="#308080"/>
    <!-- Book 7 - short, brown -->
    <polygon points="261,185 270,180 270,172 261,177" fill="#8b6914"/>

    <!-- Books on middle shelf -->
    <polygon points="185,258 195,253 195,228 185,233" fill="#d06050"/>
    <polygon points="198,252 210,246 210,232 198,238" fill="#5070b0"/>
    <polygon points="213,244 223,239 223,230 213,235" fill="#50b050"/>
  </g>

  <!-- WINDOW on right wall -->
  <g>
    <!-- Window frame -->
    <polygon points="470,120 570,170 570,80 470,30" fill="#3a3a4a" stroke="#8a7a6a" stroke-width="3"/>
    <!-- Window glass - night sky -->
    <polygon points="478,115 562,162 562,88 478,38" fill="#0a0a2a"/>
    <!-- Stars -->
    <circle cx="500" cy="60" r="1.5" fill="#fff"/>
    <circle cx="520" cy="45" r="1" fill="#fff"/>
    <circle cx="540" cy="70" r="1.5" fill="#fff"/>
    <circle cx="510" cy="90" r="1" fill="#fff"/>
    <circle cx="550" cy="100" r="1" fill="#fff"/>
    <circle cx="495" cy="80" r="1.2" fill="#fff"/>
    <circle cx="535" cy="55" r="0.8" fill="#fff"/>
    <!-- Crescent moon -->
    <circle cx="545" cy="50" r="10" fill="#f0e060"/>
    <circle cx="550" cy="47" r="8" fill="#0a0a2a"/>
    <!-- Window cross-bars -->
    <line x1="523" y1="77" x2="523" y2="137" stroke="#8a7a6a" stroke-width="2"/>
    <line x1="478" y1="76" x2="562" y2="125" stroke="#8a7a6a" stroke-width="2"/>
  </g>

  <!-- DESK - isometric box on right side of room -->
  <g filter="url(#shadow-m1)">
    <!-- Desk top surface -->
    <polygon points="420,310 560,240 500,210 360,280" fill="#8b6b4a"/>
    <!-- Desk front face (right) -->
    <polygon points="560,240 560,280 500,250 500,210" fill="#7a5a3a"/>
    <!-- Desk front face (left) -->
    <polygon points="360,280 500,210 500,250 360,320" fill="#6a4a2a"/>
    <!-- Desk legs visible -->
    <line x1="370" y1="285" x2="370" y2="320" stroke="#5a3a1a" stroke-width="3"/>
    <line x1="550" y1="245" x2="550" y2="280" stroke="#5a3a1a" stroke-width="3"/>

    <!-- Open book on desk -->
    <g>
      <!-- Left page -->
      <polygon points="440,275 480,255 470,250 430,270" fill="#f0e8d8"/>
      <!-- Right page -->
      <polygon points="480,255 520,240 510,235 470,250" fill="#e8e0d0"/>
      <!-- Spine -->
      <line x1="470" y1="250" x2="480" y2="255" stroke="#8a7a6a" stroke-width="1"/>
      <!-- Text lines on pages -->
      <line x1="438" y1="272" x2="465" y2="258" stroke="#aaa" stroke-width="0.5"/>
      <line x1="440" y1="268" x2="463" y2="256" stroke="#aaa" stroke-width="0.5"/>
      <line x1="485" y1="252" x2="512" y2="240" stroke="#aaa" stroke-width="0.5"/>
      <line x1="487" y1="249" x2="510" y2="238" stroke="#aaa" stroke-width="0.5"/>
    </g>

    <!-- Lamp on desk -->
    <g>
      <!-- Lamp base -->
      <ellipse cx="400" cy="260" rx="12" ry="6" fill="#444" transform="skewX(-15)"/>
      <!-- Lamp stem -->
      <line x1="395" y1="258" x2="395" y2="225" stroke="#555" stroke-width="3"/>
      <!-- Lamp shade (isometric trapezoid) -->
      <polygon points="380,225 410,225 405,210 385,210" fill="#d4a050"/>
      <!-- Lamp glow effect -->
      <ellipse cx="395" cy="270" rx="40" ry="25" fill="#ffdd66" opacity="0.15" filter="url(#lamp-glow-m1)"/>
    </g>
  </g>

  <!-- Warm light overlay from lamp -->
  <radialGradient id="warm-light-m1" cx="395" cy="260" r="200" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#ffdd88" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#ffdd88" stop-opacity="0"/>
  </radialGradient>
  <rect width="800" height="600" fill="url(#warm-light-m1)"/>
</svg>
