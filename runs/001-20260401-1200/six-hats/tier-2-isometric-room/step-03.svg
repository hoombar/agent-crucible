<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFA500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="42%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#FFA040" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FF8C00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070720"/>
      <stop offset="50%" stop-color="#0d0d3b"/>
      <stop offset="100%" stop-color="#1a1a5e"/>
    </linearGradient>
    <linearGradient id="floorWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="50%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#35241a"/>
    </linearGradient>
    <linearGradient id="leftWall" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="rightWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3525"/>
      <stop offset="100%" stop-color="#2a1a10"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a4a2a"/>
      <stop offset="100%" stop-color="#5a3318"/>
    </linearGradient>
    <linearGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFACD" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFACD" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dx="4" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
    <!-- Wallpaper subtle texture pattern -->
    <pattern id="wallTex" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none"/>
      <circle cx="15" cy="15" r="0.5" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0f0a15"/>

  <!-- ROOM STRUCTURE -->
  <!-- Floor -->
  <polygon points="400,450 150,300 400,150 650,300" fill="url(#floorWood)"/>
  <!-- Floor board lines -->
  <line x1="220" y1="280" x2="470" y2="430" stroke="#2a1c12" stroke-width="0.5" opacity="0.4"/>
  <line x1="260" y1="260" x2="510" y2="410" stroke="#2a1c12" stroke-width="0.5" opacity="0.4"/>
  <line x1="300" y1="240" x2="550" y2="390" stroke="#2a1c12" stroke-width="0.5" opacity="0.4"/>
  <line x1="340" y1="220" x2="590" y2="370" stroke="#2a1c12" stroke-width="0.5" opacity="0.4"/>
  <line x1="380" y1="200" x2="630" y2="350" stroke="#2a1c12" stroke-width="0.5" opacity="0.4"/>
  <line x1="420" y1="180" x2="645" y2="315" stroke="#2a1c12" stroke-width="0.5" opacity="0.4"/>

  <!-- Left wall -->
  <polygon points="150,300 150,70 400,220 400,450" fill="url(#leftWall)"/>
  <!-- Left wall subtle texture overlay -->
  <polygon points="150,300 150,70 400,220 400,450" fill="url(#wallTex)"/>
  <!-- Right wall -->
  <polygon points="400,220 400,450 650,300 650,70" fill="url(#rightWall)"/>
  <!-- Right wall subtle texture overlay -->
  <polygon points="400,220 400,450 650,300 650,70" fill="url(#wallTex)"/>

  <!-- Baseboard - left wall -->
  <polygon points="150,300 150,288 400,438 400,450" fill="#2a1a0e"/>
  <!-- Baseboard - right wall -->
  <polygon points="400,438 400,450 650,300 650,288" fill="#221508"/>

  <!-- Wall-floor edge highlights -->
  <line x1="150" y1="300" x2="400" y2="450" stroke="#2a1a10" stroke-width="1.5"/>
  <line x1="400" y1="450" x2="650" y2="300" stroke="#2a1a10" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="400" y2="450" stroke="#1a1008" stroke-width="1"/>

  <!-- PICTURE FRAME on left wall -->
  <g>
    <polygon points="290,140 290,185 345,215 345,170" fill="#3a2515"/>
    <polygon points="294,144 294,181 341,211 341,174" fill="#2a4a3a"/>
    <!-- Simple landscape in frame -->
    <polygon points="294,181 341,211 341,195 320,188 310,193 294,188" fill="#1a3a25"/>
    <circle cx="330" cy="178" r="4" fill="#FFFACD" opacity="0.6"/>
  </g>

  <!-- FLOOR - Rug -->
  <g opacity="0.9">
    <polygon points="400,390 270,320 400,250 530,320" fill="#7B2D26"/>
    <polygon points="400,380 290,318 400,256 510,318" fill="none" stroke="#DEB887" stroke-width="2"/>
    <polygon points="400,365 315,318 400,271 485,318" fill="#8B3A30"/>
    <polygon points="400,365 315,318 400,271 485,318" fill="none" stroke="#CD853F" stroke-width="1.5"/>
    <polygon points="400,348 345,318 400,288 455,318" fill="#9B4A3A"/>
    <polygon points="400,348 345,318 400,288 455,318" fill="none" stroke="#DEB887" stroke-width="1"/>
    <polygon points="400,335 368,318 400,301 432,318" fill="#A85A4A"/>
    <!-- Corner decorations -->
    <polygon points="400,258 392,262 400,266 408,262" fill="#DEB887"/>
    <polygon points="400,382 392,378 400,374 408,378" fill="#DEB887"/>
    <polygon points="272,320 276,312 280,320 276,328" fill="#DEB887"/>
    <polygon points="528,320 524,312 520,320 524,328" fill="#DEB887"/>
    <!-- Fringe -->
    <line x1="275" y1="322" x2="270" y2="328" stroke="#DEB887" stroke-width="1"/>
    <line x1="282" y1="326" x2="277" y2="332" stroke="#DEB887" stroke-width="1"/>
    <line x1="289" y1="330" x2="284" y2="336" stroke="#DEB887" stroke-width="1"/>
    <line x1="523" y1="322" x2="528" y2="328" stroke="#DEB887" stroke-width="1"/>
    <line x1="516" y1="326" x2="521" y2="332" stroke="#DEB887" stroke-width="1"/>
    <line x1="509" y1="330" x2="514" y2="336" stroke="#DEB887" stroke-width="1"/>
  </g>

  <!-- Shadow on floor from bookshelf -->
  <polygon points="205,310 310,360 330,350 225,300" fill="#000" opacity="0.15"/>

  <!-- BOOKSHELF -->
  <g filter="url(#shadow)">
    <polygon points="180,255 180,110 320,180 320,325" fill="#5C3317"/>
    <polygon points="180,110 320,180 340,168 200,98" fill="#6B3A20"/>
    <polygon points="320,180 340,168 340,313 320,325" fill="#4A2810"/>
    <!-- Shelf dividers -->
    <polygon points="180,155 320,225 340,213 200,143" fill="#6B3A20"/>
    <polygon points="180,200 320,270 340,258 200,188" fill="#6B3A20"/>

    <!-- Books on top shelf -->
    <polygon points="190,113 190,148 198,152 198,117" fill="#C41E3A"/>
    <polygon points="198,117 198,152 203,149 203,114" fill="#A0182E"/>
    <polygon points="204,116 204,146 210,150 210,120" fill="#1E90FF"/>
    <polygon points="210,120 210,150 214,147 214,117" fill="#1670CC"/>
    <polygon points="215,119 215,152 224,156 224,123" fill="#228B22"/>
    <polygon points="224,123 224,156 228,154 228,121" fill="#1A6B1A"/>
    <polygon points="229,122 229,146 235,150 235,126" fill="#DAA520"/>
    <polygon points="235,126 235,150 238,148 238,124" fill="#B8860B"/>
    <polygon points="239,126 239,153 247,157 247,130" fill="#8B008B"/>
    <polygon points="247,130 247,157 251,155 251,128" fill="#6B006B"/>
    <polygon points="252,130 252,156 262,161 262,135" fill="#FF6347"/>
    <polygon points="262,135 262,161 266,159 266,133" fill="#DD4530"/>
    <polygon points="267,134 269,155 275,159 273,138" fill="#4682B4"/>
    <polygon points="275,138 275,159 279,157 277,136" fill="#36648B"/>

    <!-- Books on middle shelf -->
    <polygon points="190,158 190,188 197,192 197,162" fill="#FF8C00"/>
    <polygon points="197,162 197,192 201,190 201,160" fill="#CC7000"/>
    <polygon points="202,163 202,195 212,200 212,168" fill="#6A5ACD"/>
    <polygon points="212,168 212,200 216,198 216,166" fill="#5448A0"/>
    <polygon points="218,170 218,192 224,196 224,174" fill="#20B2AA"/>
    <polygon points="224,174 224,196 227,194 227,172" fill="#188B85"/>
    <!-- Bookend -->
    <polygon points="230,175 230,194 236,198 236,179" fill="#8B7355"/>

    <!-- Globe on bottom shelf -->
    <circle cx="220" cy="280" r="10" fill="#3a6b8a"/>
    <ellipse cx="220" cy="280" rx="10" ry="3" fill="none" stroke="#2a5070" stroke-width="0.8"/>
    <line x1="220" y1="270" x2="220" y2="290" stroke="#2a5070" stroke-width="0.8"/>
    <line x1="220" y1="290" x2="220" y2="298" stroke="#8B7355" stroke-width="2"/>
    <ellipse cx="220" cy="299" rx="6" ry="2" fill="#8B7355"/>

    <!-- Small plant on bottom shelf -->
    <rect x="256" y="292" width="10" height="8" rx="1" fill="#8B4513"/>
    <polygon points="258,292 261,278 264,292" fill="#2d6b2d"/>
    <polygon points="260,292 263,282 266,292" fill="#3a8a3a"/>
  </g>

  <!-- WINDOW -->
  <g>
    <polygon points="490,95 490,230 605,165 605,30" fill="#3a2515"/>
    <polygon points="498,102 498,222 597,160 597,38" fill="#2a1a0a"/>
    <polygon points="502,106 502,218 593,158 593,42" fill="url(#nightSky)"/>

    <!-- Stars -->
    <circle cx="530" cy="135" r="2" fill="white" filter="url(#starGlow)"/>
    <circle cx="555" cy="100" r="1.5" fill="white" filter="url(#starGlow)"/>
    <circle cx="572" cy="125" r="1.8" fill="#ffffee" filter="url(#starGlow)"/>
    <circle cx="545" cy="78" r="1.2" fill="white" filter="url(#starGlow)"/>
    <circle cx="560" cy="150" r="1" fill="#ffffee" filter="url(#starGlow)"/>
    <circle cx="578" cy="85" r="1.5" fill="white" filter="url(#starGlow)"/>
    <circle cx="525" cy="105" r="1" fill="white"/>
    <circle cx="515" cy="160" r="0.8" fill="white"/>
    <circle cx="540" cy="170" r="1" fill="#ffffee"/>
    <circle cx="580" cy="105" r="0.8" fill="white"/>
    <circle cx="520" cy="80" r="1.2" fill="white" filter="url(#starGlow)"/>
    <circle cx="565" cy="60" r="1" fill="white"/>

    <!-- Crescent moon -->
    <circle cx="565" cy="68" r="12" fill="#FFFACD" filter="url(#starGlow)" opacity="0.5"/>
    <circle cx="565" cy="68" r="12" fill="#FFFACD"/>
    <circle cx="571" cy="64" r="10.5" fill="url(#nightSky)"/>

    <!-- Window cross bars -->
    <line x1="548" y1="72" x2="548" y2="190" stroke="#3a2515" stroke-width="4"/>
    <line x1="497" y1="162" x2="595" y2="100" stroke="#3a2515" stroke-width="4"/>

    <!-- Window sill -->
    <polygon points="488,230 605,165 615,170 498,235" fill="#4a3020"/>
    <!-- Curtain left side -->
    <polygon points="490,95 490,230 500,225 500,100" fill="#6B2D3A" opacity="0.7"/>
    <path d="M490,95 Q495,130 490,160 Q495,190 490,230" fill="none" stroke="#5a2030" stroke-width="1" opacity="0.5"/>
    <!-- Curtain right side -->
    <polygon points="597,35 597,162 605,165 605,30" fill="#6B2D3A" opacity="0.7"/>

    <!-- Small plant on window sill -->
    <polygon points="586,160 590,148 594,160" fill="#2d6b2d"/>
    <polygon points="583,162 590,145 597,162" fill="#3a8a3a"/>
    <rect x="586" y="162" width="8" height="6" rx="1" fill="#8B4513"/>
  </g>

  <!-- CHAIR - isometric, in front of desk -->
  <g filter="url(#shadow)">
    <!-- Chair seat -->
    <polygon points="340,370 380,345 420,370 380,395" fill="#5C3317"/>
    <!-- Chair back -->
    <polygon points="340,370 340,330 380,305 380,345" fill="#6B3A20"/>
    <!-- Chair back top edge -->
    <polygon points="340,330 380,305 385,303 345,328" fill="#7a4530"/>
    <!-- Chair legs -->
    <line x1="342" y1="370" x2="342" y2="395" stroke="#3d2510" stroke-width="3"/>
    <line x1="380" y1="395" x2="380" y2="420" stroke="#3d2510" stroke-width="3"/>
    <line x1="418" y1="370" x2="418" y2="395" stroke="#3d2510" stroke-width="3"/>
    <!-- Seat cushion -->
    <polygon points="345,367 380,345 415,367 380,389" fill="#8B3A30"/>
  </g>

  <!-- Shadow on floor from desk -->
  <polygon points="430,340 500,380 510,375 440,335" fill="#000" opacity="0.12"/>

  <!-- DESK -->
  <g filter="url(#shadow)">
    <polygon points="410,310 500,255 590,310 500,365" fill="url(#deskTop)"/>
    <polygon points="410,310 500,365 500,405 410,350" fill="#5C3317"/>
    <polygon points="500,365 590,310 590,350 500,405" fill="#4A2810"/>
    <!-- Drawer -->
    <polygon points="425,320 480,353 480,373 425,340" fill="#503020"/>
    <circle cx="457" cy="342" r="2" fill="#B8860B"/>
    <!-- Desk legs -->
    <line x1="413" y1="348" x2="413" y2="368" stroke="#3d2510" stroke-width="5"/>
    <line x1="587" y1="348" x2="587" y2="368" stroke="#3d2510" stroke-width="5"/>
  </g>

  <!-- LAMP on desk -->
  <g>
    <!-- Lamp glow on desk surface -->
    <ellipse cx="450" cy="308" rx="50" ry="32" fill="#FFD700" opacity="0.1"/>
    <!-- Lamp base -->
    <ellipse cx="450" cy="293" rx="14" ry="7" fill="#B8860B"/>
    <ellipse cx="450" cy="291" rx="12" ry="5" fill="#DAA520"/>
    <!-- Lamp pole -->
    <line x1="450" y1="291" x2="450" y2="238" stroke="#B8860B" stroke-width="3"/>
    <!-- Lamp shade -->
    <polygon points="433,242 467,242 473,228 427,228" fill="#DAA520"/>
    <polygon points="427,228 473,228 470,222 430,222" fill="#FFD700"/>
    <!-- Light rays -->
    <line x1="440" y1="242" x2="430" y2="268" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
    <line x1="450" y1="242" x2="450" y2="273" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
    <line x1="460" y1="242" x2="470" y2="268" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
    <!-- Lamp bulb glow -->
    <ellipse cx="450" cy="238" rx="25" ry="18" fill="#FFD700" opacity="0.15" filter="url(#softGlow)"/>
  </g>

  <!-- OPEN BOOK on desk -->
  <g>
    <ellipse cx="530" cy="288" rx="22" ry="10" fill="#000" opacity="0.08"/>
    <polygon points="510,285 510,265 530,252 530,272" fill="#FFF8E7"/>
    <polygon points="530,252 530,272 550,285 550,265" fill="#F5EEDD"/>
    <path d="M510,265 Q520,261 530,252" fill="none" stroke="#ddd" stroke-width="0.5"/>
    <path d="M550,265 Q540,261 530,252" fill="none" stroke="#ddd" stroke-width="0.5"/>
    <line x1="530" y1="252" x2="530" y2="272" stroke="#6B3A20" stroke-width="2"/>
    <!-- Text lines -->
    <line x1="513" y1="270" x2="527" y2="261" stroke="#999" stroke-width="0.5"/>
    <line x1="513" y1="274" x2="527" y2="265" stroke="#999" stroke-width="0.5"/>
    <line x1="513" y1="278" x2="525" y2="270" stroke="#aaa" stroke-width="0.5"/>
    <line x1="533" y1="261" x2="547" y2="270" stroke="#999" stroke-width="0.5"/>
    <line x1="533" y1="265" x2="547" y2="274" stroke="#999" stroke-width="0.5"/>
    <line x1="533" y1="270" x2="545" y2="278" stroke="#aaa" stroke-width="0.5"/>
  </g>

  <!-- Coffee mug on desk -->
  <g>
    <ellipse cx="565" cy="273" rx="8" ry="4" fill="#444"/>
    <ellipse cx="565" cy="273" rx="6" ry="3" fill="#2a1a0a"/>
    <rect x="557" y="273" width="16" height="12" rx="2" fill="#8B3A30"/>
    <ellipse cx="565" cy="285" rx="8" ry="3" fill="#7a2d26"/>
    <path d="M573,276 Q580,278 580,281 Q580,284 573,285" fill="none" stroke="#7a2d26" stroke-width="2"/>
    <!-- Steam -->
    <path d="M562,270 Q560,263 563,258" fill="none" stroke="white" stroke-width="0.5" opacity="0.3"/>
    <path d="M568,269 Q570,262 567,256" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>
  </g>

  <!-- Warm ambient light overlay -->
  <ellipse cx="460" cy="310" rx="200" ry="150" fill="url(#ambientGlow)"/>

  <!-- Moon light cast on floor through window (cool contrast) -->
  <polygon points="520,310 560,290 600,310 560,330" fill="#8888cc" opacity="0.04"/>
</svg>
