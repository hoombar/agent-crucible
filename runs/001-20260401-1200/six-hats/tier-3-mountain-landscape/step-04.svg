<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080114"/>
      <stop offset="12%" stop-color="#10052a"/>
      <stop offset="30%" stop-color="#251050"/>
      <stop offset="48%" stop-color="#6a2d55"/>
      <stop offset="65%" stop-color="#b84450"/>
      <stop offset="78%" stop-color="#e0804e"/>
      <stop offset="90%" stop-color="#f0a855"/>
      <stop offset="100%" stop-color="#f7d590"/>
    </linearGradient>

    <!-- Sun glow gradient -->
    <radialGradient id="sunGlow" cx="0.42" cy="0.56" r="0.42">
      <stop offset="0%" stop-color="#fff5d0" stop-opacity="0.65"/>
      <stop offset="15%" stop-color="#f4b870" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#d06848" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#8a3850" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6a2d55" stop-opacity="0"/>
    </radialGradient>

    <!-- Lake gradient -->
    <linearGradient id="lakeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b07860" stop-opacity="0.72"/>
      <stop offset="20%" stop-color="#7a5060" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#2d1d48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#080612" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Sun reflection -->
    <radialGradient id="sunReflection" cx="0.42" cy="0.06" r="0.32">
      <stop offset="0%" stop-color="#f7d590" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#e0804e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b84450" stop-opacity="0"/>
    </radialGradient>

    <!-- Snow -->
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8d0e0"/>
    </linearGradient>

    <!-- Mountain gradients -->
    <linearGradient id="mt1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8898b5"/>
      <stop offset="100%" stop-color="#9cacC2"/>
    </linearGradient>
    <linearGradient id="mt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#506070"/>
      <stop offset="100%" stop-color="#687888"/>
    </linearGradient>
    <linearGradient id="mt3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283545"/>
      <stop offset="100%" stop-color="#3a4c5e"/>
    </linearGradient>
    <linearGradient id="mt4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2433"/>
      <stop offset="100%" stop-color="#283645"/>
    </linearGradient>

    <!-- Haze overlay -->
    <linearGradient id="hazeOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6080" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c48060" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudBlur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="cloudBlurSmall"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="hazeFilter"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="lakeRipple">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.05" numOctaves="4" seed="3" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="gentleBlur"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#skyGradient)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="22" r="1.3" opacity="0.85" filter="url(#starGlow)"/>
    <circle cx="150" cy="48" r="0.8" opacity="0.55"/>
    <circle cx="250" cy="12" r="1.1" opacity="0.7" filter="url(#starGlow)"/>
    <circle cx="340" cy="38" r="0.7" opacity="0.45"/>
    <circle cx="420" cy="18" r="1.2" opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="550" cy="32" r="0.6" opacity="0.45"/>
    <circle cx="620" cy="8" r="1.4" opacity="0.85" filter="url(#starGlow)"/>
    <circle cx="700" cy="42" r="0.9" opacity="0.55"/>
    <circle cx="780" cy="20" r="1.1" opacity="0.7" filter="url(#starGlow)"/>
    <circle cx="870" cy="52" r="0.7" opacity="0.45"/>
    <circle cx="920" cy="15" r="1.3" opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="960" cy="35" r="0.6" opacity="0.35"/>
    <circle cx="45" cy="75" r="0.6" opacity="0.35"/>
    <circle cx="185" cy="90" r="0.8" opacity="0.4"/>
    <circle cx="485" cy="65" r="0.7" opacity="0.3"/>
    <circle cx="835" cy="78" r="0.5" opacity="0.25"/>
  </g>

  <!-- Sun glow -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#sunGlow)"/>

  <!-- Sun disc with warm inner core -->
  <circle cx="420" cy="338" r="42" fill="#ffe8b0" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="420" cy="338" r="28" fill="#fff4d4" opacity="0.55"/>
  <circle cx="420" cy="338" r="16" fill="#fffef0" opacity="0.4"/>

  <!-- Clouds -->
  <g>
    <ellipse cx="170" cy="65" rx="135" ry="28" fill="#5e4568" filter="url(#cloudBlur)" opacity="0.38"/>
    <ellipse cx="200" cy="60" rx="92" ry="22" fill="#806890" filter="url(#cloudBlur)" opacity="0.48"/>
    <ellipse cx="185" cy="56" rx="58" ry="16" fill="#a088aa" filter="url(#cloudBlurSmall)" opacity="0.38"/>

    <ellipse cx="720" cy="125" rx="160" ry="33" fill="#885060" filter="url(#cloudBlur)" opacity="0.36"/>
    <ellipse cx="752" cy="120" rx="115" ry="26" fill="#a87080" filter="url(#cloudBlur)" opacity="0.46"/>
    <ellipse cx="738" cy="116" rx="72" ry="18" fill="#c09098" filter="url(#cloudBlurSmall)" opacity="0.4"/>

    <ellipse cx="350" cy="216" rx="195" ry="18" fill="#d0a580" filter="url(#cloudBlur)" opacity="0.3"/>
    <ellipse cx="382" cy="212" rx="135" ry="12" fill="#ddbb98" filter="url(#cloudBlurSmall)" opacity="0.36"/>
  </g>

  <!-- Distant mountains (layer 1) -->
  <g filter="url(#hazeFilter)" opacity="0.5">
    <path d="M-50,370 L80,228 L135,262 L215,202 L305,252 L400,370 Z" fill="url(#mt1)"/>
    <path d="M550,370 L675,192 L735,232 L825,178 L915,222 L1050,370 Z" fill="url(#mt1)"/>
    <path d="M200,220 L215,202 L235,224 L225,230 Z" fill="url(#snowGrad)" opacity="0.4"/>
    <path d="M662,210 L675,192 L692,214 L680,220 Z" fill="url(#snowGrad)" opacity="0.4"/>
    <path d="M812,198 L825,178 L842,200 L830,208 Z" fill="url(#snowGrad)" opacity="0.4"/>
  </g>

  <!-- Haze between mountain layers -->
  <rect x="0" y="200" width="1000" height="180" fill="url(#hazeOverlay)"/>

  <!-- Mid mountains (layer 2) -->
  <g opacity="0.75">
    <path d="M80,400 L195,215 L265,262 L365,162 L435,232 L515,282 L650,400 Z" fill="url(#mt2)"/>
    <path d="M480,400 L615,228 L685,272 L785,208 L855,252 L1020,400 Z" fill="url(#mt2)"/>
    <path d="M350,184 L365,162 L385,188 L373,197 Z" fill="url(#snowGrad)" opacity="0.62"/>
    <path d="M188,233 L195,215 L210,236 L200,242 Z" fill="url(#snowGrad)" opacity="0.55"/>
    <path d="M772,228 L785,208 L802,232 L790,238 Z" fill="url(#snowGrad)" opacity="0.62"/>
  </g>

  <!-- Near mountains (layer 3) -->
  <g opacity="0.95">
    <path d="M-80,430 L55,262 L125,312 L235,222 L335,302 L415,322 L550,430 Z" fill="url(#mt3)"/>
    <path d="M370,430 L515,258 L585,312 L675,262 L775,322 L920,430 Z" fill="url(#mt4)"/>
    <!-- Stronger snow caps on near mountains -->
    <path d="M218,242 L235,222 L256,248 L242,258 Z" fill="url(#snowGrad)" opacity="0.85"/>
    <path d="M660,280 L675,262 L694,286 L680,294 Z" fill="url(#snowGrad)" opacity="0.85"/>
    <!-- Mountain shadow/shading on right side -->
    <path d="M235,222 L335,302 L415,322 L550,430 L420,430 L335,350 Z" fill="#151d2a" opacity="0.15"/>
    <path d="M675,262 L775,322 L920,430 L780,430 L735,370 Z" fill="#151d2a" opacity="0.18"/>
  </g>

  <!-- Birds -->
  <g stroke="#1a1020" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M478,248 L483,244 L488,248 L493,244 L498,248"/>
    <path d="M518,238 L522,235 L526,238 L530,235 L534,238"/>
    <path d="M458,258 L461,255 L464,258 L467,255 L470,258"/>
  </g>

  <!-- Far trees -->
  <g fill="#385840" opacity="0.4">
    <polygon points="38,412 47,390 56,412"/>
    <polygon points="60,410 70,386 80,410"/>
    <polygon points="88,413 99,388 110,413"/>
    <polygon points="128,411 139,387 150,411"/>
    <polygon points="838,411 849,387 860,411"/>
    <polygon points="868,410 879,386 890,410"/>
    <polygon points="898,413 910,388 922,413"/>
    <polygon points="938,411 948,390 958,411"/>
  </g>

  <!-- Mid trees -->
  <g fill="#284530" opacity="0.62">
    <polygon points="166,420 179,380 192,420"/>
    <polygon points="172,406 179,386 186,406"/>
    <polygon points="213,422 229,376 245,422"/>
    <polygon points="220,406 229,382 238,406"/>
    <polygon points="278,420 294,377 310,420"/>
    <polygon points="285,404 294,382 303,404"/>
    <polygon points="748,420 764,377 780,420"/>
    <polygon points="755,404 764,382 773,404"/>
    <polygon points="798,422 817,372 836,422"/>
    <polygon points="806,404 817,378 828,404"/>
  </g>

  <!-- Near trees (detailed, prominent) -->
  <g opacity="0.95">
    <!-- Tree 1 -->
    <rect x="347" y="413" width="6" height="17" fill="#101308"/>
    <polygon points="316,430 350,360 384,430" fill="#101808"/>
    <polygon points="323,415 350,368 377,415" fill="#162310"/>
    <polygon points="330,400 350,374 370,400" fill="#1c2e15"/>

    <!-- Tree 2 (large) -->
    <rect x="427" y="410" width="7" height="20" fill="#101308"/>
    <polygon points="391,430 430,344 469,430" fill="#0c160c"/>
    <polygon points="399,414 430,353 461,414" fill="#122010"/>
    <polygon points="407,398 430,362 453,398" fill="#182a14"/>
    <polygon points="414,384 430,369 446,384" fill="#1e3216"/>

    <!-- Tree 3 -->
    <rect x="509" y="415" width="6" height="15" fill="#101308"/>
    <polygon points="480,430 512,362 544,430" fill="#101808"/>
    <polygon points="487,415 512,370 537,415" fill="#162310"/>
    <polygon points="494,400 512,377 530,400" fill="#1c2e15"/>

    <!-- Tree 4 (tallest, focal) -->
    <rect x="595" y="408" width="8" height="22" fill="#101308"/>
    <polygon points="552,430 599,328 646,430" fill="#0a130a"/>
    <polygon points="560,414 599,338 638,414" fill="#101e0e"/>
    <polygon points="568,398 599,348 630,398" fill="#162812"/>
    <polygon points="575,382 599,357 623,382" fill="#1c3216"/>
    <polygon points="582,368 599,365 616,368" fill="#203818"/>

    <!-- Tree 5 -->
    <rect x="671" y="413" width="6" height="17" fill="#101308"/>
    <polygon points="642,430 674,352 706,430" fill="#0c160c"/>
    <polygon points="650,414 674,360 698,414" fill="#122010"/>
    <polygon points="657,400 674,368 691,400" fill="#182a14"/>
  </g>

  <!-- Shore details -->
  <path d="M0,430 Q120,426 250,430 Q380,433 500,429 Q650,431 800,430 Q900,428 1000,430" fill="none" stroke="#28200a" stroke-width="2.5" opacity="0.45"/>
  <g fill="#28200a" opacity="0.35">
    <ellipse cx="48" cy="430" rx="9" ry="4"/>
    <ellipse cx="178" cy="428" rx="6" ry="3"/>
    <ellipse cx="308" cy="431" rx="11" ry="4"/>
    <ellipse cx="580" cy="430" rx="5" ry="3"/>
    <ellipse cx="698" cy="429" rx="7" ry="3"/>
    <ellipse cx="848" cy="431" rx="10" ry="4"/>
    <ellipse cx="948" cy="430" rx="6" ry="3"/>
  </g>

  <!-- Lake -->
  <rect x="0" y="432" width="1000" height="168" fill="url(#lakeGradient)"/>

  <!-- Mountain reflections in lake -->
  <g opacity="0.2" filter="url(#lakeRipple)" transform="translate(0, 862) scale(1, -1)">
    <path d="M-80,430 L55,262 L125,312 L235,222 L335,302 L415,322 L550,430 Z" fill="#182030"/>
    <path d="M370,430 L515,258 L585,312 L675,262 L775,322 L920,430 Z" fill="#182030"/>
  </g>

  <!-- Tree reflections in lake -->
  <g opacity="0.1" filter="url(#lakeRipple)" transform="translate(0, 862) scale(1, -1)">
    <polygon points="316,430 350,360 384,430" fill="#080e08"/>
    <polygon points="391,430 430,344 469,430" fill="#080e08"/>
    <polygon points="480,430 512,362 544,430" fill="#080e08"/>
    <polygon points="552,430 599,328 646,430" fill="#080e08"/>
    <polygon points="642,430 674,352 706,430" fill="#080e08"/>
  </g>

  <!-- Sun reflection on lake -->
  <rect x="0" y="432" width="1000" height="168" fill="url(#sunReflection)"/>

  <!-- Sun reflection pillar (vertical light column on water) -->
  <g opacity="0.12">
    <rect x="400" y="432" width="40" height="168" fill="#f7d590" filter="url(#gentleBlur)"/>
    <rect x="410" y="432" width="20" height="168" fill="#ffe8b0" opacity="0.5" filter="url(#gentleBlur)"/>
  </g>

  <!-- Lake shimmer lines -->
  <g stroke="#f7d590" stroke-width="0.5" opacity="0.16">
    <line x1="320" y1="445" x2="520" y2="445"/>
    <line x1="290" y1="458" x2="550" y2="458"/>
    <line x1="250" y1="472" x2="590" y2="472"/>
    <line x1="220" y1="488" x2="620" y2="488"/>
    <line x1="260" y1="504" x2="580" y2="504"/>
    <line x1="300" y1="520" x2="540" y2="520"/>
    <line x1="330" y1="536" x2="510" y2="536"/>
    <line x1="355" y1="552" x2="485" y2="552"/>
    <line x1="375" y1="568" x2="465" y2="568"/>
    <line x1="390" y1="582" x2="450" y2="582"/>
  </g>

  <!-- Foreground dark anchor -->
  <rect x="0" y="582" width="1000" height="18" fill="#04030a" opacity="0.55"/>
</svg>
