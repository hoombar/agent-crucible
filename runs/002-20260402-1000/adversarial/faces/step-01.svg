<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Skin tone gradients for advanced faces -->
    <radialGradient id="skinGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FDDCB5"/>
      <stop offset="70%" stop-color="#F5C6A0"/>
      <stop offset="100%" stop-color="#E8AD85"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4A0A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F4A0A0" stop-opacity="0"/>
    </radialGradient>
    <!-- Eye highlight -->
    <radialGradient id="eyeHighlight" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C3A1E"/>
      <stop offset="100%" stop-color="#3A2210"/>
    </linearGradient>
    <!-- Intermediate skin -->
    <radialGradient id="skinGradMid" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FDDCB5"/>
      <stop offset="100%" stop-color="#F0BB94"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F0F0"/>

  <!-- Grid structure:
       Left margin: 120px for row labels
       Top margin: 60px for column labels
       Grid area: 1080 x 740
       Cell size: 540 x 246.67 (approx)
       Using: columns at x=120 and x=660, rows at y=60, y=306, y=553
  -->

  <!-- Column labels -->
  <text x="390" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">HAPPY</text>
  <text x="930" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">SAD</text>

  <!-- Row labels -->
  <text x="60" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" transform="rotate(-90, 60, 190)">BEGINNER</text>
  <text x="60" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" transform="rotate(-90, 60, 436)">INTERMEDIATE</text>
  <text x="60" y="683" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" transform="rotate(-90, 60, 683)">ADVANCED</text>

  <!-- Grid lines -->
  <line x1="120" y1="60" x2="1200" y2="60" stroke="#CCC" stroke-width="1"/>
  <line x1="120" y1="306" x2="1200" y2="306" stroke="#CCC" stroke-width="1"/>
  <line x1="120" y1="553" x2="1200" y2="553" stroke="#CCC" stroke-width="1"/>
  <line x1="120" y1="800" x2="1200" y2="800" stroke="#CCC" stroke-width="1"/>
  <line x1="120" y1="60" x2="120" y2="800" stroke="#CCC" stroke-width="1"/>
  <line x1="660" y1="60" x2="660" y2="800" stroke="#CCC" stroke-width="1"/>
  <line x1="1200" y1="60" x2="1200" y2="800" stroke="#CCC" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- ROW 1: BEGINNER                              -->
  <!-- ============================================ -->

  <!-- Face 1: Beginner Happy (center: 390, 183) -->
  <g transform="translate(390, 183)">
    <!-- Head -->
    <circle cx="0" cy="0" r="80" fill="#FFE0B2" stroke="#333" stroke-width="2"/>
    <!-- Eyes - simple dots -->
    <circle cx="-25" cy="-15" r="5" fill="#333"/>
    <circle cx="25" cy="-15" r="5" fill="#333"/>
    <!-- Happy mouth - upward arc -->
    <path d="M -30 20 Q 0 50 30 20" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Face 2: Beginner Sad (center: 930, 183) -->
  <g transform="translate(930, 183)">
    <!-- Head -->
    <circle cx="0" cy="0" r="80" fill="#FFE0B2" stroke="#333" stroke-width="2"/>
    <!-- Eyes - simple dots -->
    <circle cx="-25" cy="-15" r="5" fill="#333"/>
    <circle cx="25" cy="-15" r="5" fill="#333"/>
    <!-- Sad mouth - downward arc -->
    <path d="M -30 30 Q 0 10 30 30" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ============================================ -->
  <!-- ROW 2: INTERMEDIATE                          -->
  <!-- ============================================ -->

  <!-- Face 3: Intermediate Happy (center: 390, 430) -->
  <g transform="translate(390, 430)">
    <!-- Head - oval -->
    <ellipse cx="0" cy="0" rx="70" ry="85" fill="url(#skinGradMid)" stroke="#C9956B" stroke-width="1.5"/>
    <!-- Ears -->
    <ellipse cx="-68" cy="-5" rx="12" ry="18" fill="#F0BB94" stroke="#C9956B" stroke-width="1"/>
    <ellipse cx="68" cy="-5" rx="12" ry="18" fill="#F0BB94" stroke="#C9956B" stroke-width="1"/>
    <!-- Hair -->
    <path d="M -65 -35 Q -70 -90 -20 -90 Q 0 -95 20 -90 Q 70 -90 65 -35" fill="#5C3A1E" stroke="none"/>
    <path d="M -65 -35 Q -72 -55 -60 -70 Q -40 -90 0 -88 Q 40 -90 60 -70 Q 72 -55 65 -35" fill="#5C3A1E" stroke="none"/>
    <!-- Eyebrows - raised for happiness -->
    <path d="M -35 -35 Q -25 -45 -15 -37" fill="none" stroke="#5C3A1E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 15 -37 Q 25 -45 35 -35" fill="none" stroke="#5C3A1E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes - slightly squinted -->
    <ellipse cx="-25" cy="-18" rx="10" ry="8" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="-25" cy="-17" r="5" fill="#6B4226"/>
    <circle cx="-25" cy="-17" r="2.5" fill="#222"/>
    <ellipse cx="25" cy="-18" rx="10" ry="8" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="25" cy="-17" r="5" fill="#6B4226"/>
    <circle cx="25" cy="-17" r="2.5" fill="#222"/>
    <!-- Nose -->
    <path d="M 0 -8 Q 3 5 8 12 Q 0 15 -8 12 Q -3 5 0 -8" fill="none" stroke="#C9956B" stroke-width="1.2"/>
    <!-- Happy mouth - smile with raised cheeks -->
    <path d="M -25 25 Q -15 40 0 42 Q 15 40 25 25" fill="#E88080" stroke="#C06060" stroke-width="1"/>
    <!-- Cheek blush -->
    <circle cx="-35" cy="18" r="15" fill="url(#cheekGrad)" opacity="0.6"/>
    <circle cx="35" cy="18" r="15" fill="url(#cheekGrad)" opacity="0.6"/>
  </g>

  <!-- Face 4: Intermediate Sad (center: 930, 430) -->
  <g transform="translate(930, 430)">
    <!-- Head - oval -->
    <ellipse cx="0" cy="0" rx="70" ry="85" fill="url(#skinGradMid)" stroke="#C9956B" stroke-width="1.5"/>
    <!-- Ears -->
    <ellipse cx="-68" cy="-5" rx="12" ry="18" fill="#F0BB94" stroke="#C9956B" stroke-width="1"/>
    <ellipse cx="68" cy="-5" rx="12" ry="18" fill="#F0BB94" stroke="#C9956B" stroke-width="1"/>
    <!-- Hair -->
    <path d="M -65 -35 Q -70 -90 -20 -90 Q 0 -95 20 -90 Q 70 -90 65 -35" fill="#5C3A1E" stroke="none"/>
    <path d="M -65 -35 Q -72 -55 -60 -70 Q -40 -90 0 -88 Q 40 -90 60 -70 Q 72 -55 65 -35" fill="#5C3A1E" stroke="none"/>
    <!-- Eyebrows - lowered, angled down for sadness -->
    <path d="M -35 -32 Q -25 -38 -15 -30" fill="none" stroke="#5C3A1E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 15 -30 Q 25 -38 35 -32" fill="none" stroke="#5C3A1E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes - downcast -->
    <ellipse cx="-25" cy="-15" rx="10" ry="9" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="-25" cy="-12" r="5" fill="#6B4226"/>
    <circle cx="-25" cy="-12" r="2.5" fill="#222"/>
    <ellipse cx="25" cy="-15" rx="10" ry="9" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="25" cy="-12" r="5" fill="#6B4226"/>
    <circle cx="25" cy="-12" r="2.5" fill="#222"/>
    <!-- Nose -->
    <path d="M 0 -8 Q 3 5 8 12 Q 0 15 -8 12 Q -3 5 0 -8" fill="none" stroke="#C9956B" stroke-width="1.2"/>
    <!-- Sad mouth - drooped corners -->
    <path d="M -22 30 Q -10 26 0 27 Q 10 26 22 30" fill="none" stroke="#A06060" stroke-width="2" stroke-linecap="round"/>
    <!-- Slight frown wrinkle -->
    <path d="M -18 34 Q 0 30 18 34" fill="none" stroke="#D4A880" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- ROW 3: ADVANCED                              -->
  <!-- ============================================ -->

  <!-- Face 5: Advanced Happy (center: 390, 676) -->
  <g transform="translate(390, 676)">
    <!-- Face shape with gradient -->
    <ellipse cx="0" cy="0" rx="75" ry="90" fill="url(#skinGrad)" stroke="none"/>
    <!-- Jaw definition -->
    <path d="M -60 20 Q -65 60 -30 85 Q 0 95 30 85 Q 65 60 60 20" fill="url(#skinGrad)" stroke="none"/>
    <!-- Neck -->
    <rect x="-20" y="80" width="40" height="30" fill="#F0BB94" stroke="none"/>
    <!-- Ears -->
    <ellipse cx="-72" cy="-5" rx="10" ry="16" fill="#F0BB94" stroke="#D4A070" stroke-width="0.8"/>
    <path d="M -72 -15 Q -67 -5 -72 5" fill="none" stroke="#D4A070" stroke-width="0.5"/>
    <ellipse cx="72" cy="-5" rx="10" ry="16" fill="#F0BB94" stroke="#D4A070" stroke-width="0.8"/>
    <path d="M 72 -15 Q 67 -5 72 5" fill="none" stroke="#D4A070" stroke-width="0.5"/>
    <!-- Hair - volumetric -->
    <path d="M -70 -30 Q -78 -70 -50 -90 Q -25 -105 0 -100 Q 25 -105 50 -90 Q 78 -70 70 -30 Q 75 -50 65 -65 Q 45 -90 0 -92 Q -45 -90 -65 -65 Q -75 -50 -70 -30" fill="url(#hairGrad)" stroke="none"/>
    <path d="M -68 -30 Q -75 -65 -50 -85 Q -20 -100 0 -95 Q 20 -100 50 -85 Q 75 -65 68 -30" fill="url(#hairGrad)" stroke="none"/>
    <!-- Side hair -->
    <path d="M -70 -30 Q -76 -10 -72 10" fill="none" stroke="#3A2210" stroke-width="4" stroke-linecap="round"/>
    <path d="M 70 -30 Q 76 -10 72 10" fill="none" stroke="#3A2210" stroke-width="4" stroke-linecap="round"/>
    <!-- Forehead highlight -->
    <ellipse cx="0" cy="-45" rx="30" ry="15" fill="white" opacity="0.08"/>
    <!-- Eyebrows - relaxed, slightly raised -->
    <path d="M -40 -38 Q -30 -46 -15 -40" fill="none" stroke="#4A2A10" stroke-width="2" stroke-linecap="round"/>
    <path d="M 15 -40 Q 30 -46 40 -38" fill="none" stroke="#4A2A10" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes - detailed with warmth -->
    <!-- Left eye -->
    <ellipse cx="-25" cy="-20" rx="12" ry="9" fill="white" stroke="#888" stroke-width="0.5"/>
    <circle cx="-25" cy="-19" r="6" fill="#6B4226"/>
    <circle cx="-25" cy="-19" r="3" fill="#1A1A1A"/>
    <circle cx="-27" cy="-22" r="1.5" fill="white" opacity="0.9"/>
    <circle cx="-23" cy="-18" r="0.8" fill="white" opacity="0.5"/>
    <!-- Upper eyelid crease -->
    <path d="M -37 -25 Q -25 -32 -13 -25" fill="none" stroke="#C9956B" stroke-width="0.7"/>
    <!-- Lower eyelid - slightly raised (squinting from smile) -->
    <path d="M -37 -16 Q -25 -13 -13 -16" fill="none" stroke="#C9956B" stroke-width="0.5"/>
    <!-- Crow's feet -->
    <line x1="-38" y1="-22" x2="-42" y2="-25" stroke="#C9956B" stroke-width="0.5" opacity="0.6"/>
    <line x1="-38" y1="-20" x2="-43" y2="-20" stroke="#C9956B" stroke-width="0.5" opacity="0.6"/>
    <line x1="-38" y1="-18" x2="-42" y2="-15" stroke="#C9956B" stroke-width="0.5" opacity="0.6"/>
    <!-- Right eye -->
    <ellipse cx="25" cy="-20" rx="12" ry="9" fill="white" stroke="#888" stroke-width="0.5"/>
    <circle cx="25" cy="-19" r="6" fill="#6B4226"/>
    <circle cx="25" cy="-19" r="3" fill="#1A1A1A"/>
    <circle cx="23" cy="-22" r="1.5" fill="white" opacity="0.9"/>
    <circle cx="27" cy="-18" r="0.8" fill="white" opacity="0.5"/>
    <!-- Upper eyelid crease -->
    <path d="M 13 -25 Q 25 -32 37 -25" fill="none" stroke="#C9956B" stroke-width="0.7"/>
    <!-- Lower eyelid -->
    <path d="M 13 -16 Q 25 -13 37 -16" fill="none" stroke="#C9956B" stroke-width="0.5"/>
    <!-- Crow's feet -->
    <line x1="38" y1="-22" x2="42" y2="-25" stroke="#C9956B" stroke-width="0.5" opacity="0.6"/>
    <line x1="38" y1="-20" x2="43" y2="-20" stroke="#C9956B" stroke-width="0.5" opacity="0.6"/>
    <line x1="38" y1="-18" x2="42" y2="-15" stroke="#C9956B" stroke-width="0.5" opacity="0.6"/>
    <!-- Nose - defined -->
    <path d="M 0 -15 Q 2 0 8 12 Q 4 16 0 17 Q -4 16 -8 12 Q -2 0 0 -15" fill="none" stroke="#C9956B" stroke-width="1"/>
    <!-- Nose shadow -->
    <path d="M -5 12 Q 0 14 5 12" fill="none" stroke="#D4A070" stroke-width="0.6"/>
    <!-- Duchenne smile - raised cheeks, natural curves -->
    <path d="M -30 18 Q -20 38 0 42 Q 20 38 30 18" fill="#E07070" stroke="#B85555" stroke-width="0.8"/>
    <!-- Teeth hint -->
    <path d="M -20 22 Q 0 30 20 22" fill="white" stroke="none" opacity="0.7"/>
    <!-- Upper lip -->
    <path d="M -30 18 Q -15 16 0 20 Q 15 16 30 18" fill="none" stroke="#B07060" stroke-width="0.8"/>
    <!-- Nasolabial folds -->
    <path d="M -32 5 Q -35 15 -30 22" fill="none" stroke="#D4A070" stroke-width="0.6" opacity="0.5"/>
    <path d="M 32 5 Q 35 15 30 22" fill="none" stroke="#D4A070" stroke-width="0.6" opacity="0.5"/>
    <!-- Raised cheek blush -->
    <ellipse cx="-32" cy="10" rx="16" ry="10" fill="#F4A0A0" opacity="0.25"/>
    <ellipse cx="32" cy="10" rx="16" ry="10" fill="#F4A0A0" opacity="0.25"/>
    <!-- Chin definition -->
    <path d="M -10 75 Q 0 82 10 75" fill="none" stroke="#D4A070" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Face 6: Advanced Sad (center: 930, 676) -->
  <g transform="translate(930, 676)">
    <!-- Slight head tilt -->
    <g transform="rotate(-3)">
      <!-- Face shape -->
      <ellipse cx="0" cy="0" rx="75" ry="90" fill="url(#skinGrad)" stroke="none"/>
      <path d="M -60 20 Q -65 60 -30 85 Q 0 95 30 85 Q 65 60 60 20" fill="url(#skinGrad)" stroke="none"/>
      <!-- Neck -->
      <rect x="-20" y="80" width="40" height="30" fill="#F0BB94" stroke="none"/>
      <!-- Ears -->
      <ellipse cx="-72" cy="-5" rx="10" ry="16" fill="#F0BB94" stroke="#D4A070" stroke-width="0.8"/>
      <ellipse cx="72" cy="-5" rx="10" ry="16" fill="#F0BB94" stroke="#D4A070" stroke-width="0.8"/>
      <!-- Hair -->
      <path d="M -68 -30 Q -75 -65 -50 -85 Q -20 -100 0 -95 Q 20 -100 50 -85 Q 75 -65 68 -30" fill="url(#hairGrad)" stroke="none"/>
      <path d="M -70 -30 Q -76 -10 -72 10" fill="none" stroke="#3A2210" stroke-width="4" stroke-linecap="round"/>
      <path d="M 70 -30 Q 76 -10 72 10" fill="none" stroke="#3A2210" stroke-width="4" stroke-linecap="round"/>
      <!-- Forehead tension lines -->
      <path d="M -15 -50 Q 0 -53 15 -50" fill="none" stroke="#D4A070" stroke-width="0.5" opacity="0.5"/>
      <path d="M -12 -46 Q 0 -49 12 -46" fill="none" stroke="#D4A070" stroke-width="0.5" opacity="0.4"/>
      <!-- Eyebrows - inner raised (grief expression) -->
      <path d="M -38 -36 Q -30 -40 -18 -43" fill="none" stroke="#4A2A10" stroke-width="2" stroke-linecap="round"/>
      <path d="M 18 -43 Q 30 -40 38 -36" fill="none" stroke="#4A2A10" stroke-width="2" stroke-linecap="round"/>
      <!-- Left eye - glistening, downcast -->
      <ellipse cx="-25" cy="-18" rx="12" ry="10" fill="white" stroke="#888" stroke-width="0.5"/>
      <circle cx="-26" cy="-15" r="6" fill="#6B4226"/>
      <circle cx="-26" cy="-15" r="3" fill="#1A1A1A"/>
      <circle cx="-28" cy="-18" r="1.5" fill="white" opacity="0.9"/>
      <circle cx="-24" cy="-14" r="0.8" fill="white" opacity="0.5"/>
      <!-- Glistening effect - tear film -->
      <path d="M -37 -12 Q -25 -8 -13 -12" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
      <!-- Upper eyelid heavy -->
      <path d="M -37 -22 Q -25 -28 -13 -22" fill="none" stroke="#C9956B" stroke-width="1"/>
      <!-- Right eye -->
      <ellipse cx="25" cy="-18" rx="12" ry="10" fill="white" stroke="#888" stroke-width="0.5"/>
      <circle cx="24" cy="-15" r="6" fill="#6B4226"/>
      <circle cx="24" cy="-15" r="3" fill="#1A1A1A"/>
      <circle cx="22" cy="-18" r="1.5" fill="white" opacity="0.9"/>
      <circle cx="26" cy="-14" r="0.8" fill="white" opacity="0.5"/>
      <path d="M 13 -12 Q 25 -8 37 -12" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
      <path d="M 13 -22 Q 25 -28 37 -22" fill="none" stroke="#C9956B" stroke-width="1"/>
      <!-- Nose -->
      <path d="M 0 -15 Q 2 0 8 12 Q 4 16 0 17 Q -4 16 -8 12 Q -2 0 0 -15" fill="none" stroke="#C9956B" stroke-width="1"/>
      <!-- Nose redness hint (from crying) -->
      <ellipse cx="0" cy="14" rx="8" ry="4" fill="#E8A0A0" opacity="0.15"/>
      <!-- Mouth - compressed lips, slight downturn -->
      <path d="M -22 28 Q -10 26 0 27 Q 10 26 22 28" fill="#D09080" stroke="#B07060" stroke-width="0.8"/>
      <!-- Lower lip slight tremble -->
      <path d="M -18 30 Q 0 34 18 30" fill="#D89888" stroke="none" opacity="0.6"/>
      <!-- Nasolabial folds - deeper -->
      <path d="M -30 5 Q -34 15 -28 25" fill="none" stroke="#C9956B" stroke-width="0.7" opacity="0.5"/>
      <path d="M 30 5 Q 34 15 28 25" fill="none" stroke="#C9956B" stroke-width="0.7" opacity="0.5"/>
      <!-- Under-eye shadow -->
      <ellipse cx="-25" cy="-8" rx="10" ry="3" fill="#C9956B" opacity="0.15"/>
      <ellipse cx="25" cy="-8" rx="10" ry="3" fill="#C9956B" opacity="0.15"/>
    </g>
  </g>

</svg>