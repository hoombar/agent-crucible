<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Warm background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#E8E0D8"/>
    </linearGradient>

    <!-- Skin gradients -->
    <radialGradient id="skinWarm" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFECD2"/>
      <stop offset="50%" stop-color="#F5D5B8"/>
      <stop offset="100%" stop-color="#E8BC94"/>
    </radialGradient>

    <radialGradient id="skinDeep" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFF0DC"/>
      <stop offset="40%" stop-color="#F7DABD"/>
      <stop offset="80%" stop-color="#E8BC94"/>
      <stop offset="100%" stop-color="#C99B6D"/>
    </radialGradient>

    <!-- Eye iris gradient -->
    <radialGradient id="irisGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="40%" stop-color="#4A90D9"/>
      <stop offset="80%" stop-color="#2B5E8C"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </radialGradient>

    <!-- Blush gradient -->
    <radialGradient id="blush">
      <stop offset="0%" stop-color="#FF9999" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF9999" stop-opacity="0"/>
    </radialGradient>

    <!-- Lip gradient -->
    <linearGradient id="lipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4736E"/>
      <stop offset="100%" stop-color="#B85A55"/>
    </linearGradient>

    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8B6243"/>
      <stop offset="50%" stop-color="#6B4226"/>
      <stop offset="100%" stop-color="#4A2D18"/>
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="2" dy="3" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for happy faces -->
    <filter id="warmGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.05 0 1 0 0 0.03 0 0 1 0 0 0 0 0 0.3 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tear shimmer -->
    <linearGradient id="tearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#B8D8F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Decorative subtle pattern -->
  <circle cx="100" cy="100" r="300" fill="#E0D8D0" opacity="0.15"/>
  <circle cx="1100" cy="700" r="250" fill="#D8D0C8" opacity="0.12"/>

  <!-- Column headers -->
  <text x="390" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#5A4A3A" letter-spacing="3">HAPPY</text>
  <text x="870" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#5A4A3A" letter-spacing="3">SAD</text>

  <!-- Row labels -->
  <text x="70" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7A6A5A" letter-spacing="2" transform="rotate(-90,70,195)">BEGINNER</text>
  <text x="70" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7A6A5A" letter-spacing="2" transform="rotate(-90,70,435)">INTERMEDIATE</text>
  <text x="70" y="675" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7A6A5A" letter-spacing="2" transform="rotate(-90,70,675)">ADVANCED</text>

  <!-- Subtle cell backgrounds -->
  <rect x="140" y="60" width="440" height="230" rx="12" fill="white" opacity="0.4"/>
  <rect x="620" y="60" width="440" height="230" rx="12" fill="white" opacity="0.4"/>
  <rect x="140" y="300" width="440" height="230" rx="12" fill="white" opacity="0.4"/>
  <rect x="620" y="300" width="440" height="230" rx="12" fill="white" opacity="0.4"/>
  <rect x="140" y="540" width="440" height="230" rx="12" fill="white" opacity="0.4"/>
  <rect x="620" y="540" width="440" height="230" rx="12" fill="white" opacity="0.4"/>

  <!-- ==================== -->
  <!-- FACE 1: Beginner Happy -->
  <!-- ==================== -->
  <g transform="translate(360,175)" filter="url(#warmGlow)">
    <circle cx="0" cy="0" r="78" fill="#FFECD2" stroke="#C9A882" stroke-width="2.5"/>
    <!-- Rosy cheeks -->
    <circle cx="-30" cy="15" r="15" fill="url(#blush)"/>
    <circle cx="30" cy="15" r="15" fill="url(#blush)"/>
    <!-- Eyes - friendly dots -->
    <circle cx="-22" cy="-12" r="7" fill="#3A3A3A"/>
    <circle cx="-19" cy="-15" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="22" cy="-12" r="7" fill="#3A3A3A"/>
    <circle cx="25" cy="-15" r="2.5" fill="white" opacity="0.8"/>
    <!-- Big happy smile -->
    <path d="M-32,18 Q0,55 32,18" fill="none" stroke="#6A4A3A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 2: Beginner Sad -->
  <!-- ==================== -->
  <g transform="translate(840,175)">
    <circle cx="0" cy="0" r="78" fill="#FFECD2" stroke="#C9A882" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="-22" cy="-12" r="7" fill="#3A3A3A"/>
    <circle cx="-19" cy="-15" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="22" cy="-12" r="7" fill="#3A3A3A"/>
    <circle cx="25" cy="-15" r="2.5" fill="white" opacity="0.8"/>
    <!-- Sad mouth -->
    <path d="M-28,30 Q0,12 28,30" fill="none" stroke="#6A4A3A" stroke-width="3" stroke-linecap="round"/>
    <!-- Simple tear -->
    <path d="M-18,-2 Q-20,8 -16,6" fill="url(#tearGrad)" stroke="none"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 3: Intermediate Happy -->
  <!-- ==================== -->
  <g transform="translate(360,415)" filter="url(#softShadow)">
    <!-- Head -->
    <ellipse cx="0" cy="5" rx="68" ry="82" fill="url(#skinWarm)"/>
    <!-- Hair -->
    <path d="M-70,-25 Q-72,-68 -35,-82 Q0,-92 35,-82 Q72,-68 70,-25 Q65,-50 35,-65 Q0,-75 -35,-65 Q-65,-50 -70,-25 Z" fill="url(#hairGrad)"/>
    <path d="M-68,-28 Q-65,-50 -40,-62" fill="none" stroke="#8B6243" stroke-width="2" opacity="0.5"/>
    <path d="M-50,-55 Q-30,-68 0,-70" fill="none" stroke="#8B6243" stroke-width="1.5" opacity="0.4"/>
    <!-- Ears -->
    <ellipse cx="-66" cy="5" rx="10" ry="16" fill="#F5D5B8" stroke="#D4A574" stroke-width="0.8"/>
    <ellipse cx="66" cy="5" rx="10" ry="16" fill="#F5D5B8" stroke="#D4A574" stroke-width="0.8"/>
    <!-- Eyebrows -->
    <path d="M-40,-28 Q-27,-38 -12,-30" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12,-30 Q27,-38 40,-28" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes with detail -->
    <ellipse cx="-24" cy="-12" rx="11" ry="8" fill="white"/>
    <circle cx="-23" cy="-11" r="5" fill="#4A90D9"/>
    <circle cx="-23" cy="-11" r="2.5" fill="#1A2A3A"/>
    <circle cx="-21" cy="-13" r="1.5" fill="white" opacity="0.85"/>
    <ellipse cx="24" cy="-12" rx="11" ry="7" fill="white"/>
    <circle cx="25" cy="-11" r="5" fill="#4A90D9"/>
    <circle cx="25" cy="-11" r="2.5" fill="#1A2A3A"/>
    <circle cx="27" cy="-13" r="1.5" fill="white" opacity="0.85"/>
    <!-- Nose -->
    <path d="M0,-2 Q-5,10 -6,16 Q0,19 6,16 Q5,10 0,-2" fill="#ECC8A0" stroke="#D4A574" stroke-width="0.5" opacity="0.7"/>
    <!-- Smile -->
    <path d="M-28,28 Q-14,46 0,44 Q14,46 28,28" fill="url(#lipGrad)" stroke="#A04040" stroke-width="0.8"/>
    <!-- Teeth hint -->
    <path d="M-20,30 Q0,36 20,30" fill="white" opacity="0.4"/>
    <!-- Blush -->
    <ellipse cx="-35" cy="22" rx="14" ry="7" fill="#FF9999" opacity="0.25"/>
    <ellipse cx="35" cy="22" rx="14" ry="7" fill="#FF9999" opacity="0.25"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 4: Intermediate Sad -->
  <!-- ==================== -->
  <g transform="translate(840,415)" filter="url(#softShadow)">
    <!-- Head -->
    <ellipse cx="0" cy="5" rx="68" ry="82" fill="url(#skinWarm)"/>
    <!-- Hair -->
    <path d="M-70,-25 Q-72,-68 -35,-82 Q0,-92 35,-82 Q72,-68 70,-25 Q65,-50 35,-65 Q0,-75 -35,-65 Q-65,-50 -70,-25 Z" fill="url(#hairGrad)"/>
    <path d="M-68,-28 Q-65,-50 -40,-62" fill="none" stroke="#8B6243" stroke-width="2" opacity="0.5"/>
    <!-- Ears -->
    <ellipse cx="-66" cy="5" rx="10" ry="16" fill="#F5D5B8" stroke="#D4A574" stroke-width="0.8"/>
    <ellipse cx="66" cy="5" rx="10" ry="16" fill="#F5D5B8" stroke="#D4A574" stroke-width="0.8"/>
    <!-- Eyebrows (lowered, angled inward) -->
    <path d="M-40,-24 Q-27,-30 -12,-28" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12,-28 Q27,-30 40,-24" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes (downcast) -->
    <ellipse cx="-24" cy="-12" rx="11" ry="8" fill="white"/>
    <circle cx="-24" cy="-9" r="5" fill="#4A90D9"/>
    <circle cx="-24" cy="-9" r="2.5" fill="#1A2A3A"/>
    <circle cx="-22" cy="-11" r="1.3" fill="white" opacity="0.7"/>
    <ellipse cx="24" cy="-12" rx="11" ry="8" fill="white"/>
    <circle cx="24" cy="-9" r="5" fill="#4A90D9"/>
    <circle cx="24" cy="-9" r="2.5" fill="#1A2A3A"/>
    <circle cx="26" cy="-11" r="1.3" fill="white" opacity="0.7"/>
    <!-- Nose -->
    <path d="M0,-2 Q-5,10 -6,16 Q0,19 6,16 Q5,10 0,-2" fill="#ECC8A0" stroke="#D4A574" stroke-width="0.5" opacity="0.7"/>
    <!-- Sad mouth -->
    <path d="M-24,32 Q-12,26 0,28 Q12,26 24,32" fill="none" stroke="#9A6060" stroke-width="2" stroke-linecap="round"/>
    <!-- Tear tracks -->
    <path d="M-18,-3 Q-22,10 -20,22" fill="none" stroke="#B8D8F0" stroke-width="1.5" opacity="0.5"/>
    <path d="M20,-3 Q24,12 22,20" fill="none" stroke="#B8D8F0" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 5: Advanced Happy -->
  <!-- ==================== -->
  <g transform="translate(360,655)" filter="url(#softShadow)">
    <!-- Neck hint -->
    <rect x="-20" y="70" width="40" height="25" rx="8" fill="#E8BC94" opacity="0.6"/>
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="72" ry="88" fill="url(#skinDeep)"/>
    <!-- Jaw sculpting -->
    <path d="M-58,25 Q-50,72 -20,85 Q0,90 20,85 Q50,72 58,25" fill="url(#skinDeep)" opacity="0.5"/>
    <!-- Hair with volume and texture -->
    <path d="M-76,-15 Q-78,-70 -42,-88 Q-10,-100 22,-92 Q52,-82 72,-62 Q80,-40 76,-15 Q74,-52 42,-72 Q12,-82 -18,-78 Q-48,-70 -66,-48 Z" fill="url(#hairGrad)"/>
    <path d="M-74,-20 Q-72,-60 -38,-80" fill="none" stroke="#9B7253" stroke-width="2" opacity="0.4"/>
    <path d="M-55,-60 Q-30,-75 0,-78 Q30,-75 55,-60" fill="none" stroke="#9B7253" stroke-width="1.5" opacity="0.3"/>
    <path d="M-60,-45 Q-40,-62 -15,-68" fill="none" stroke="#7B5233" stroke-width="1" opacity="0.3"/>
    <!-- Ears -->
    <ellipse cx="-70" cy="2" rx="9" ry="15" fill="#EDCAA0" stroke="#C99B6D" stroke-width="0.5"/>
    <ellipse cx="70" cy="2" rx="9" ry="15" fill="#EDCAA0" stroke="#C99B6D" stroke-width="0.5"/>
    <!-- Eyebrows -->
    <path d="M-44,-32 Q-30,-42 -12,-36" fill="none" stroke="#5A3520" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M12,-36 Q30,-42 44,-32" fill="none" stroke="#5A3520" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Eye sockets -->
    <ellipse cx="-26" cy="-18" rx="16" ry="11" fill="#E0BF96" opacity="0.3"/>
    <ellipse cx="26" cy="-18" rx="16" ry="11" fill="#E0BF96" opacity="0.3"/>
    <!-- Left eye -->
    <ellipse cx="-26" cy="-18" rx="14" ry="9" fill="white" stroke="#A0907A" stroke-width="0.5"/>
    <circle cx="-25" cy="-17" r="6" fill="url(#irisGrad)"/>
    <circle cx="-25" cy="-17" r="2.8" fill="#0E1A28"/>
    <circle cx="-23" cy="-20" r="2" fill="white" opacity="0.9"/>
    <circle cx="-27" cy="-16" r="0.8" fill="white" opacity="0.4"/>
    <!-- Crow's feet -->
    <path d="M-42,-14 Q-46,-16 -48,-18" fill="none" stroke="#C99B6D" stroke-width="0.6" opacity="0.5"/>
    <path d="M-42,-17 Q-46,-18 -48,-20" fill="none" stroke="#C99B6D" stroke-width="0.5" opacity="0.4"/>
    <!-- Right eye -->
    <ellipse cx="26" cy="-18" rx="14" ry="9" fill="white" stroke="#A0907A" stroke-width="0.5"/>
    <circle cx="27" cy="-17" r="6" fill="url(#irisGrad)"/>
    <circle cx="27" cy="-17" r="2.8" fill="#0E1A28"/>
    <circle cx="29" cy="-20" r="2" fill="white" opacity="0.9"/>
    <circle cx="25" cy="-16" r="0.8" fill="white" opacity="0.4"/>
    <!-- Crow's feet right -->
    <path d="M42,-14 Q46,-16 48,-18" fill="none" stroke="#C99B6D" stroke-width="0.6" opacity="0.5"/>
    <path d="M42,-17 Q46,-18 48,-20" fill="none" stroke="#C99B6D" stroke-width="0.5" opacity="0.4"/>
    <!-- Nose -->
    <path d="M0,-10 Q-5,4 -8,14 Q-4,19 0,20 Q4,19 8,14 Q5,4 0,-10 Z" fill="#EDC8A0" stroke="#C99B6D" stroke-width="0.4"/>
    <path d="M2,-8 Q3,2 2,12" fill="none" stroke="#FFF0DC" stroke-width="1" opacity="0.4"/>
    <!-- Nasolabial folds -->
    <path d="M-14,14 Q-20,24 -28,32" fill="none" stroke="#C99B6D" stroke-width="0.6" opacity="0.4"/>
    <path d="M14,14 Q20,24 28,32" fill="none" stroke="#C99B6D" stroke-width="0.6" opacity="0.4"/>
    <!-- Duchenne smile -->
    <path d="M-30,26 Q-18,44 0,46 Q18,44 30,26" fill="url(#lipGrad)" stroke="#8A3A35" stroke-width="0.6"/>
    <path d="M-24,28 Q0,34 24,28" fill="white" opacity="0.3"/>
    <!-- Raised cheeks -->
    <ellipse cx="-38" cy="18" rx="16" ry="9" fill="#FF9999" opacity="0.2"/>
    <ellipse cx="38" cy="18" rx="16" ry="9" fill="#FF9999" opacity="0.2"/>
    <!-- Cheek highlight -->
    <ellipse cx="-42" cy="10" rx="8" ry="4" fill="white" opacity="0.1"/>
    <ellipse cx="42" cy="10" rx="8" ry="4" fill="white" opacity="0.1"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 6: Advanced Sad -->
  <!-- ==================== -->
  <g transform="translate(840,655)" filter="url(#softShadow)">
    <g transform="rotate(4)">
      <!-- Neck hint -->
      <rect x="-20" y="70" width="40" height="25" rx="8" fill="#E8BC94" opacity="0.5"/>
      <!-- Head -->
      <ellipse cx="0" cy="0" rx="72" ry="88" fill="url(#skinDeep)"/>
      <path d="M-58,25 Q-50,72 -20,85 Q0,90 20,85 Q50,72 58,25" fill="url(#skinDeep)" opacity="0.5"/>
      <!-- Hair -->
      <path d="M-76,-15 Q-78,-70 -42,-88 Q-10,-100 22,-92 Q52,-82 72,-62 Q80,-40 76,-15 Q74,-52 42,-72 Q12,-82 -18,-78 Q-48,-70 -66,-48 Z" fill="url(#hairGrad)"/>
      <path d="M-74,-20 Q-72,-60 -38,-80" fill="none" stroke="#9B7253" stroke-width="2" opacity="0.4"/>
      <path d="M-55,-60 Q-30,-75 0,-78" fill="none" stroke="#7B5233" stroke-width="1" opacity="0.3"/>
      <!-- Ears -->
      <ellipse cx="-70" cy="2" rx="9" ry="15" fill="#EDCAA0" stroke="#C99B6D" stroke-width="0.5"/>
      <ellipse cx="70" cy="2" rx="9" ry="15" fill="#EDCAA0" stroke="#C99B6D" stroke-width="0.5"/>
      <!-- Eyebrows (inner raised — grief expression) -->
      <path d="M-44,-28 Q-32,-32 -12,-38" fill="none" stroke="#5A3520" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M12,-38 Q32,-32 44,-28" fill="none" stroke="#5A3520" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Forehead tension -->
      <path d="M-18,-48 Q0,-52 18,-48" fill="none" stroke="#C99B6D" stroke-width="0.4" opacity="0.4"/>
      <path d="M-12,-44 Q0,-47 12,-44" fill="none" stroke="#C99B6D" stroke-width="0.3" opacity="0.3"/>
      <!-- Eye sockets -->
      <ellipse cx="-26" cy="-18" rx="16" ry="11" fill="#DDB88A" opacity="0.35"/>
      <ellipse cx="26" cy="-18" rx="16" ry="11" fill="#DDB88A" opacity="0.35"/>
      <!-- Left eye (slightly reddened, glistening) -->
      <ellipse cx="-26" cy="-18" rx="14" ry="9" fill="#FFF8F0" stroke="#B09080" stroke-width="0.5"/>
      <circle cx="-26" cy="-16" r="6" fill="url(#irisGrad)"/>
      <circle cx="-26" cy="-16" r="2.8" fill="#0E1A28"/>
      <circle cx="-24" cy="-19" r="1.8" fill="white" opacity="0.85"/>
      <!-- Tear well -->
      <ellipse cx="-26" cy="-9" rx="10" ry="2.5" fill="#C8E0F0" opacity="0.25"/>
      <!-- Tear -->
      <path d="M-20,-9 Q-22,2 -18,8 Q-16,12 -18,16" fill="url(#tearGrad)" stroke="#B0D0E8" stroke-width="0.3" opacity="0.6"/>
      <!-- Right eye -->
      <ellipse cx="26" cy="-18" rx="14" ry="9" fill="#FFF8F0" stroke="#B09080" stroke-width="0.5"/>
      <circle cx="26" cy="-16" r="6" fill="url(#irisGrad)"/>
      <circle cx="26" cy="-16" r="2.8" fill="#0E1A28"/>
      <circle cx="28" cy="-19" r="1.8" fill="white" opacity="0.85"/>
      <ellipse cx="26" cy="-9" rx="10" ry="2.5" fill="#C8E0F0" opacity="0.2"/>
      <!-- Nose (slightly reddened) -->
      <path d="M0,-10 Q-5,4 -8,14 Q-4,19 0,20 Q4,19 8,14 Q5,4 0,-10 Z" fill="#F0C4A0" stroke="#C99B6D" stroke-width="0.4"/>
      <path d="M2,-8 Q3,2 2,12" fill="none" stroke="#FFF0DC" stroke-width="1" opacity="0.3"/>
      <!-- Reddened nose tip -->
      <ellipse cx="0" cy="16" rx="6" ry="4" fill="#E0A090" opacity="0.2"/>
      <!-- Nasolabial folds (deeper) -->
      <path d="M-14,14 Q-20,24 -24,36" fill="none" stroke="#C99B6D" stroke-width="0.8" opacity="0.5"/>
      <path d="M14,14 Q20,24 24,36" fill="none" stroke="#C99B6D" stroke-width="0.8" opacity="0.5"/>
      <!-- Compressed, trembling lips -->
      <path d="M-20,30 Q-10,27 0,28 Q10,27 20,30" fill="#C08080" stroke="#A06060" stroke-width="0.8"/>
      <path d="M-16,32 Q0,34 16,32" fill="#B07070" stroke="none" opacity="0.5"/>
      <!-- Chin dimple from tension -->
      <ellipse cx="0" cy="50" rx="10" ry="4" fill="#D4A574" opacity="0.15"/>
    </g>
  </g>
</svg>
