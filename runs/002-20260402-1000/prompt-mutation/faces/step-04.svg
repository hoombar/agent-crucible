<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#E8E0D8"/>
    </linearGradient>

    <radialGradient id="skinBasic" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFECD2"/>
      <stop offset="100%" stop-color="#FFE0BD"/>
    </radialGradient>

    <radialGradient id="skinWarm" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFECD2"/>
      <stop offset="50%" stop-color="#F5D5B8"/>
      <stop offset="100%" stop-color="#E8BC94"/>
    </radialGradient>

    <radialGradient id="skinDeep" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFF0DC"/>
      <stop offset="40%" stop-color="#F7DABD"/>
      <stop offset="80%" stop-color="#E8BC94"/>
      <stop offset="100%" stop-color="#C99B6D"/>
    </radialGradient>

    <radialGradient id="irisGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="40%" stop-color="#4A90D9"/>
      <stop offset="80%" stop-color="#2B5E8C"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </radialGradient>

    <radialGradient id="blush">
      <stop offset="0%" stop-color="#FF9999" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF9999" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4736E"/>
      <stop offset="100%" stop-color="#B85A55"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8B6243"/>
      <stop offset="50%" stop-color="#6B4226"/>
      <stop offset="100%" stop-color="#4A2D18"/>
    </linearGradient>

    <linearGradient id="tearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#B8D8F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="2" dy="3" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="warmGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.05 0 1 0 0 0.03 0 0 1 0 0 0 0 0 0.3 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Column headers -->
  <text x="360" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#5A4A3A" letter-spacing="3">HAPPY</text>
  <text x="840" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#5A4A3A" letter-spacing="3">SAD</text>

  <!-- Row labels -->
  <text x="65" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7A6A5A" letter-spacing="2" transform="rotate(-90,65,175)">BEGINNER</text>
  <text x="65" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7A6A5A" letter-spacing="2" transform="rotate(-90,65,415)">INTERMEDIATE</text>
  <text x="65" y="655" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7A6A5A" letter-spacing="2" transform="rotate(-90,65,655)">ADVANCED</text>

  <!-- Cell backgrounds -->
  <rect x="125" y="60" width="460" height="230" rx="12" fill="white" opacity="0.35" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="615" y="60" width="460" height="230" rx="12" fill="white" opacity="0.35" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="125" y="300" width="460" height="230" rx="12" fill="white" opacity="0.35" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="615" y="300" width="460" height="230" rx="12" fill="white" opacity="0.35" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="125" y="540" width="460" height="230" rx="12" fill="white" opacity="0.35" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="615" y="540" width="460" height="230" rx="12" fill="white" opacity="0.35" stroke="#D8D0C8" stroke-width="0.5"/>

  <!-- ==================== -->
  <!-- FACE 1: Beginner Happy -->
  <!-- ==================== -->
  <g transform="translate(360,175)" filter="url(#warmGlow)">
    <circle cx="0" cy="0" r="75" fill="url(#skinBasic)" stroke="#C9A882" stroke-width="2.5"/>
    <!-- Rosy cheeks -->
    <circle cx="-28" cy="12" r="14" fill="url(#blush)"/>
    <circle cx="28" cy="12" r="14" fill="url(#blush)"/>
    <!-- Simple dot eyes — classic smiley -->
    <circle cx="-22" cy="-12" r="6" fill="#3A3A3A"/>
    <circle cx="-19" cy="-15" r="2" fill="white" opacity="0.7"/>
    <circle cx="22" cy="-12" r="6" fill="#3A3A3A"/>
    <circle cx="25" cy="-15" r="2" fill="white" opacity="0.7"/>
    <!-- Classic upward arc smile -->
    <path d="M-28,18 Q0,48 28,18" fill="none" stroke="#6A4A3A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 2: Beginner Sad -->
  <!-- ==================== -->
  <g transform="translate(840,175)">
    <circle cx="0" cy="0" r="75" fill="url(#skinBasic)" stroke="#C9A882" stroke-width="2.5"/>
    <!-- Simple dot eyes -->
    <circle cx="-22" cy="-12" r="6" fill="#3A3A3A"/>
    <circle cx="-19" cy="-15" r="2" fill="white" opacity="0.7"/>
    <circle cx="22" cy="-12" r="6" fill="#3A3A3A"/>
    <circle cx="25" cy="-15" r="2" fill="white" opacity="0.7"/>
    <!-- Classic downward arc frown -->
    <path d="M-28,28 Q0,10 28,28" fill="none" stroke="#6A4A3A" stroke-width="3" stroke-linecap="round"/>
    <!-- Simple teardrop -->
    <path d="M-16,-4 Q-18,4 -14,2" fill="#B8D8F0" opacity="0.5" stroke="none"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 3: Intermediate Happy -->
  <!-- ==================== -->
  <g transform="translate(360,415)" filter="url(#softShadow)">
    <!-- Head oval -->
    <ellipse cx="0" cy="0" rx="68" ry="82" fill="url(#skinWarm)"/>
    <!-- Hair — organic paths -->
    <path d="M-70,-18 Q-72,-62 -35,-78 Q0,-88 35,-78 Q72,-62 70,-18 Q65,-46 35,-61 Q0,-71 -35,-61 Q-65,-46 -70,-18 Z" fill="url(#hairGrad)"/>
    <path d="M-68,-22 Q-65,-48 -38,-60" fill="none" stroke="#8B6243" stroke-width="2" opacity="0.5"/>
    <path d="M-50,-52 Q-28,-65 0,-68" fill="none" stroke="#8B6243" stroke-width="1.5" opacity="0.4"/>
    <!-- Ears -->
    <ellipse cx="-66" cy="2" rx="10" ry="15" fill="#F5D5B8" stroke="#D4A574" stroke-width="0.8"/>
    <ellipse cx="66" cy="2" rx="10" ry="15" fill="#F5D5B8" stroke="#D4A574" stroke-width="0.8"/>
    <!-- Eyebrows (raised for happiness) -->
    <path d="M-36,-28 Q-24,-40 -10,-30" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10,-30 Q24,-40 36,-28" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left eye with upper eyelid line -->
    <ellipse cx="-23" cy="-12" rx="11" ry="7" fill="white"/>
    <path d="M-34,-13 Q-23,-20 -12,-13" fill="none" stroke="#8A7060" stroke-width="1" opacity="0.6"/>
    <circle cx="-22" cy="-11" r="5" fill="#4A90D9"/>
    <circle cx="-22" cy="-11" r="2.5" fill="#1A2A3A"/>
    <circle cx="-20" cy="-13" r="1.5" fill="white" opacity="0.85"/>
    <!-- Right eye (slightly squinted for genuine smile) -->
    <ellipse cx="23" cy="-12" rx="11" ry="6" fill="white"/>
    <path d="M12,-13 Q23,-19 34,-13" fill="none" stroke="#8A7060" stroke-width="1" opacity="0.6"/>
    <circle cx="24" cy="-11" r="5" fill="#4A90D9"/>
    <circle cx="24" cy="-11" r="2.5" fill="#1A2A3A"/>
    <circle cx="26" cy="-13" r="1.5" fill="white" opacity="0.85"/>
    <!-- Nose -->
    <path d="M0,-3 Q-5,8 -6,14 Q0,17 6,14 Q5,8 0,-3" fill="#ECC8A0" stroke="#D4A574" stroke-width="0.5" opacity="0.7"/>
    <!-- Smile with lip gradient -->
    <path d="M-28,24 Q-14,42 0,40 Q14,42 28,24" fill="url(#lipGrad)" stroke="#A04040" stroke-width="0.8"/>
    <path d="M-20,26 Q0,32 20,26" fill="white" opacity="0.35"/>
    <!-- Cheek blush -->
    <ellipse cx="-33" cy="18" rx="13" ry="7" fill="#FF9999" opacity="0.25"/>
    <ellipse cx="33" cy="18" rx="13" ry="7" fill="#FF9999" opacity="0.25"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 4: Intermediate Sad -->
  <!-- ==================== -->
  <g transform="translate(840,415)" filter="url(#softShadow)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="68" ry="82" fill="url(#skinWarm)"/>
    <!-- Hair -->
    <path d="M-70,-18 Q-72,-62 -35,-78 Q0,-88 35,-78 Q72,-62 70,-18 Q65,-46 35,-61 Q0,-71 -35,-61 Q-65,-46 -70,-18 Z" fill="url(#hairGrad)"/>
    <path d="M-68,-22 Q-65,-48 -38,-60" fill="none" stroke="#8B6243" stroke-width="2" opacity="0.5"/>
    <!-- Ears -->
    <ellipse cx="-66" cy="2" rx="10" ry="15" fill="#F5D5B8" stroke="#D4A574" stroke-width="0.8"/>
    <ellipse cx="66" cy="2" rx="10" ry="15" fill="#F5D5B8" stroke="#D4A574" stroke-width="0.8"/>
    <!-- Eyebrows (lowered, angled inward) -->
    <path d="M-36,-25 Q-24,-32 -10,-28" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10,-28 Q24,-32 36,-25" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left eye (downcast) with eyelid -->
    <ellipse cx="-23" cy="-12" rx="11" ry="7" fill="white"/>
    <path d="M-34,-12 Q-23,-19 -12,-12" fill="none" stroke="#8A7060" stroke-width="1" opacity="0.6"/>
    <circle cx="-23" cy="-9" r="5" fill="#4A90D9"/>
    <circle cx="-23" cy="-9" r="2.5" fill="#1A2A3A"/>
    <circle cx="-21" cy="-11" r="1.3" fill="white" opacity="0.7"/>
    <!-- Right eye (downcast) -->
    <ellipse cx="23" cy="-12" rx="11" ry="7" fill="white"/>
    <path d="M12,-12 Q23,-19 34,-12" fill="none" stroke="#8A7060" stroke-width="1" opacity="0.6"/>
    <circle cx="23" cy="-9" r="5" fill="#4A90D9"/>
    <circle cx="23" cy="-9" r="2.5" fill="#1A2A3A"/>
    <circle cx="25" cy="-11" r="1.3" fill="white" opacity="0.7"/>
    <!-- Nose -->
    <path d="M0,-3 Q-5,8 -6,14 Q0,17 6,14 Q5,8 0,-3" fill="#ECC8A0" stroke="#D4A574" stroke-width="0.5" opacity="0.7"/>
    <!-- Sad mouth -->
    <path d="M-23,28 Q-12,23 0,25 Q12,23 23,28" fill="none" stroke="#9A6060" stroke-width="2" stroke-linecap="round"/>
    <!-- Tear tracks -->
    <path d="M-17,-3 Q-21,8 -19,20" fill="none" stroke="#B8D8F0" stroke-width="1.5" opacity="0.5"/>
    <path d="M19,-3 Q23,10 21,18" fill="none" stroke="#B8D8F0" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 5: Advanced Happy -->
  <!-- ==================== -->
  <g transform="translate(360,655)" filter="url(#softShadow)">
    <!-- Neck -->
    <rect x="-18" y="68" width="36" height="22" rx="8" fill="#E8BC94" opacity="0.6"/>
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="70" ry="85" fill="url(#skinDeep)"/>
    <!-- Jaw -->
    <path d="M-54,28 Q-44,72 0,85 Q44,72 54,28" fill="url(#skinDeep)" opacity="0.5"/>
    <!-- Hair with volume and texture -->
    <path d="M-74,-14 Q-76,-68 -40,-85 Q-8,-96 22,-90 Q50,-80 70,-60 Q78,-38 74,-14 Q72,-50 40,-68 Q10,-78 -18,-76 Q-46,-68 -64,-45 Z" fill="url(#hairGrad)"/>
    <path d="M-72,-18 Q-70,-58 -36,-78" fill="none" stroke="#9B7253" stroke-width="2" opacity="0.4"/>
    <path d="M-53,-58 Q-28,-72 0,-76 Q28,-72 53,-58" fill="none" stroke="#9B7253" stroke-width="1.5" opacity="0.3"/>
    <path d="M-58,-42 Q-38,-60 -13,-66" fill="none" stroke="#7B5233" stroke-width="1" opacity="0.3"/>
    <!-- Ears -->
    <ellipse cx="-68" cy="2" rx="9" ry="14" fill="#EDCAA0" stroke="#C99B6D" stroke-width="0.5"/>
    <ellipse cx="68" cy="2" rx="9" ry="14" fill="#EDCAA0" stroke="#C99B6D" stroke-width="0.5"/>
    <!-- Eyebrows (relaxed, gently raised) -->
    <path d="M-42,-30 Q-28,-40 -10,-34" fill="none" stroke="#5A3520" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M10,-34 Q28,-40 42,-30" fill="none" stroke="#5A3520" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Eye sockets -->
    <ellipse cx="-25" cy="-16" rx="15" ry="10" fill="#E0BF96" opacity="0.3"/>
    <ellipse cx="25" cy="-16" rx="15" ry="10" fill="#E0BF96" opacity="0.3"/>
    <!-- Left eye (squinted for Duchenne — reduced ry) -->
    <ellipse cx="-25" cy="-16" rx="13" ry="7.5" fill="white" stroke="#A0907A" stroke-width="0.5"/>
    <path d="M-38,-17 Q-25,-25 -12,-17" fill="none" stroke="#8A7060" stroke-width="0.8"/>
    <circle cx="-24" cy="-15" r="5.5" fill="url(#irisGrad)"/>
    <circle cx="-24" cy="-15" r="2.5" fill="#0E1A28"/>
    <circle cx="-22" cy="-18" r="1.8" fill="white" opacity="0.9"/>
    <circle cx="-26" cy="-14" r="0.7" fill="white" opacity="0.4"/>
    <!-- Lower eyelid pushed up from smile -->
    <path d="M-38,-14 Q-25,-10 -12,-14" fill="none" stroke="#C99B6D" stroke-width="0.5" opacity="0.3"/>
    <!-- Crow's feet -->
    <path d="M-40,-12 Q-44,-14 -46,-16" fill="none" stroke="#C99B6D" stroke-width="0.6" opacity="0.5"/>
    <path d="M-40,-15 Q-44,-16 -46,-18" fill="none" stroke="#C99B6D" stroke-width="0.5" opacity="0.4"/>
    <path d="M-39,-18 Q-43,-18 -45,-20" fill="none" stroke="#C99B6D" stroke-width="0.4" opacity="0.3"/>
    <!-- Right eye (squinted) -->
    <ellipse cx="25" cy="-16" rx="13" ry="7.5" fill="white" stroke="#A0907A" stroke-width="0.5"/>
    <path d="M12,-17 Q25,-25 38,-17" fill="none" stroke="#8A7060" stroke-width="0.8"/>
    <circle cx="26" cy="-15" r="5.5" fill="url(#irisGrad)"/>
    <circle cx="26" cy="-15" r="2.5" fill="#0E1A28"/>
    <circle cx="28" cy="-18" r="1.8" fill="white" opacity="0.9"/>
    <circle cx="24" cy="-14" r="0.7" fill="white" opacity="0.4"/>
    <!-- Lower eyelid pushed up -->
    <path d="M12,-14 Q25,-10 38,-14" fill="none" stroke="#C99B6D" stroke-width="0.5" opacity="0.3"/>
    <!-- Crow's feet right -->
    <path d="M40,-12 Q44,-14 46,-16" fill="none" stroke="#C99B6D" stroke-width="0.6" opacity="0.5"/>
    <path d="M40,-15 Q44,-16 46,-18" fill="none" stroke="#C99B6D" stroke-width="0.5" opacity="0.4"/>
    <path d="M39,-18 Q43,-18 45,-20" fill="none" stroke="#C99B6D" stroke-width="0.4" opacity="0.3"/>
    <!-- Nose -->
    <path d="M0,-8 Q-5,4 -7,13 Q-3,17 0,18 Q3,17 7,13 Q5,4 0,-8 Z" fill="#EDC8A0" stroke="#C99B6D" stroke-width="0.4"/>
    <path d="M2,-6 Q3,2 2,11" fill="none" stroke="#FFF0DC" stroke-width="1" opacity="0.4"/>
    <!-- Nasolabial folds -->
    <path d="M-13,12 Q-19,22 -27,30" fill="none" stroke="#C99B6D" stroke-width="0.6" opacity="0.4"/>
    <path d="M13,12 Q19,22 27,30" fill="none" stroke="#C99B6D" stroke-width="0.6" opacity="0.4"/>
    <!-- Duchenne smile -->
    <path d="M-28,24 Q-16,42 0,44 Q16,42 28,24" fill="url(#lipGrad)" stroke="#8A3A35" stroke-width="0.6"/>
    <path d="M-22,26 Q0,32 22,26" fill="white" opacity="0.3"/>
    <!-- Raised cheeks -->
    <ellipse cx="-36" cy="16" rx="15" ry="8" fill="#FF9999" opacity="0.2"/>
    <ellipse cx="36" cy="16" rx="15" ry="8" fill="#FF9999" opacity="0.2"/>
    <!-- Cheek highlight -->
    <ellipse cx="-40" cy="8" rx="7" ry="3.5" fill="white" opacity="0.12"/>
    <ellipse cx="40" cy="8" rx="7" ry="3.5" fill="white" opacity="0.12"/>
  </g>

  <!-- ==================== -->
  <!-- FACE 6: Advanced Sad -->
  <!-- ==================== -->
  <g transform="translate(840,655)" filter="url(#softShadow)">
    <g transform="rotate(3)">
      <!-- Neck -->
      <rect x="-18" y="68" width="36" height="22" rx="8" fill="#E8BC94" opacity="0.5"/>
      <!-- Head -->
      <ellipse cx="0" cy="0" rx="70" ry="85" fill="url(#skinDeep)"/>
      <path d="M-54,28 Q-44,72 0,85 Q44,72 54,28" fill="url(#skinDeep)" opacity="0.5"/>
      <!-- Hair -->
      <path d="M-74,-14 Q-76,-68 -40,-85 Q-8,-96 22,-90 Q50,-80 70,-60 Q78,-38 74,-14 Q72,-50 40,-68 Q10,-78 -18,-76 Q-46,-68 -64,-45 Z" fill="url(#hairGrad)"/>
      <path d="M-72,-18 Q-70,-58 -36,-78" fill="none" stroke="#9B7253" stroke-width="2" opacity="0.4"/>
      <path d="M-53,-58 Q-28,-72 0,-76" fill="none" stroke="#7B5233" stroke-width="1" opacity="0.3"/>
      <!-- Ears -->
      <ellipse cx="-68" cy="2" rx="9" ry="14" fill="#EDCAA0" stroke="#C99B6D" stroke-width="0.5"/>
      <ellipse cx="68" cy="2" rx="9" ry="14" fill="#EDCAA0" stroke="#C99B6D" stroke-width="0.5"/>
      <!-- Eyebrows (inner corners raised — grief) -->
      <path d="M-40,-28 Q-28,-32 -12,-37" fill="none" stroke="#5A3520" stroke-width="2" stroke-linecap="round"/>
      <path d="M12,-37 Q28,-32 40,-28" fill="none" stroke="#5A3520" stroke-width="2" stroke-linecap="round"/>
      <!-- Forehead tension -->
      <path d="M-18,-43 Q-8,-46 0,-44 Q8,-46 18,-43" fill="none" stroke="#C99B6D" stroke-width="0.4" opacity="0.5"/>
      <!-- Eye sockets (deeper shadow for sadness) -->
      <ellipse cx="-25" cy="-16" rx="15" ry="10" fill="#DDB88A" opacity="0.4"/>
      <ellipse cx="25" cy="-16" rx="15" ry="10" fill="#DDB88A" opacity="0.4"/>
      <!-- Left eye (heavy upper lid, glistening) -->
      <ellipse cx="-25" cy="-16" rx="13" ry="8" fill="#FFF8F0" stroke="#B09080" stroke-width="0.5"/>
      <path d="M-38,-17 Q-25,-25 -12,-17" fill="none" stroke="#8A7060" stroke-width="1.2"/>
      <!-- Heavy upper eyelid -->
      <path d="M-38,-17 Q-25,-22 -12,-17" fill="#E8C49A" opacity="0.25"/>
      <circle cx="-25" cy="-14" r="5.5" fill="url(#irisGrad)"/>
      <circle cx="-25" cy="-14" r="2.5" fill="#0E1A28"/>
      <circle cx="-23" cy="-17" r="1.6" fill="white" opacity="0.85"/>
      <!-- Tear well -->
      <ellipse cx="-25" cy="-8" rx="9" ry="2.5" fill="#C8E0F0" opacity="0.25"/>
      <!-- Tear rolling down -->
      <path d="M-19,-8 Q-21,2 -17,8 Q-15,12 -17,16" fill="url(#tearGrad)" stroke="#B0D0E8" stroke-width="0.3" opacity="0.6"/>
      <!-- Right eye -->
      <ellipse cx="25" cy="-16" rx="13" ry="8" fill="#FFF8F0" stroke="#B09080" stroke-width="0.5"/>
      <path d="M12,-17 Q25,-25 38,-17" fill="none" stroke="#8A7060" stroke-width="1.2"/>
      <path d="M12,-17 Q25,-22 38,-17" fill="#E8C49A" opacity="0.25"/>
      <circle cx="25" cy="-14" r="5.5" fill="url(#irisGrad)"/>
      <circle cx="25" cy="-14" r="2.5" fill="#0E1A28"/>
      <circle cx="27" cy="-17" r="1.6" fill="white" opacity="0.85"/>
      <ellipse cx="25" cy="-8" rx="9" ry="2.5" fill="#C8E0F0" opacity="0.2"/>
      <!-- Nose (reddened tip) -->
      <path d="M0,-8 Q-5,4 -7,13 Q-3,17 0,18 Q3,17 7,13 Q5,4 0,-8 Z" fill="#F0C4A0" stroke="#C99B6D" stroke-width="0.4"/>
      <path d="M2,-6 Q3,2 2,11" fill="none" stroke="#FFF0DC" stroke-width="1" opacity="0.3"/>
      <ellipse cx="0" cy="15" rx="5" ry="3.5" fill="#E0A090" opacity="0.2"/>
      <!-- Nasolabial folds (deep) -->
      <path d="M-13,12 Q-19,22 -23,34" fill="none" stroke="#C99B6D" stroke-width="0.8" opacity="0.5"/>
      <path d="M13,12 Q19,22 23,34" fill="none" stroke="#C99B6D" stroke-width="0.8" opacity="0.5"/>
      <!-- Compressed lips -->
      <path d="M-18,28 Q-8,25 0,26 Q8,25 18,28" fill="#C08080" stroke="#A06060" stroke-width="0.8"/>
      <path d="M-14,30 Q0,32 14,30" fill="#B07070" stroke="none" opacity="0.5"/>
      <!-- Chin tension -->
      <ellipse cx="0" cy="48" rx="9" ry="3.5" fill="#D4A574" opacity="0.15"/>
    </g>
  </g>
</svg>
