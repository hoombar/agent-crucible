<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#f0f0f0"/>

  <!-- Grid structure -->
  <!-- Column labels -->
  <text x="400" y="45" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">HAPPY</text>
  <text x="900" y="45" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">SAD</text>

  <!-- Row labels -->
  <text x="80" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">BEGINNER</text>
  <text x="80" y="440" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">INTERMEDIATE</text>
  <text x="80" y="680" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">ADVANCED</text>

  <!-- Grid lines -->
  <line x1="150" y1="60" x2="1150" y2="60" stroke="#ccc" stroke-width="1"/>
  <line x1="150" y1="305" x2="1150" y2="305" stroke="#ccc" stroke-width="1"/>
  <line x1="150" y1="550" x2="1150" y2="550" stroke="#ccc" stroke-width="1"/>
  <line x1="150" y1="790" x2="1150" y2="790" stroke="#ccc" stroke-width="1"/>
  <line x1="150" y1="60" x2="150" y2="790" stroke="#ccc" stroke-width="1"/>
  <line x1="650" y1="60" x2="650" y2="790" stroke="#ccc" stroke-width="1"/>
  <line x1="1150" y1="60" x2="1150" y2="790" stroke="#ccc" stroke-width="1"/>

  <!-- Cell backgrounds -->
  <rect x="151" y="61" width="498" height="243" fill="#f8f8f8" rx="4"/>
  <rect x="651" y="61" width="498" height="243" fill="#f8f8f8" rx="4"/>
  <rect x="151" y="306" width="498" height="243" fill="#f8f8f8" rx="4"/>
  <rect x="651" y="306" width="498" height="243" fill="#f8f8f8" rx="4"/>
  <rect x="151" y="551" width="498" height="238" fill="#f8f8f8" rx="4"/>
  <rect x="651" y="551" width="498" height="238" fill="#f8f8f8" rx="4"/>

  <!-- ==================== BEGINNER HAPPY (Row 1, Col 1) ==================== -->
  <g transform="translate(400, 182)">
    <!-- Head - simple circle -->
    <circle cx="0" cy="0" r="80" fill="#FFD993" stroke="#333" stroke-width="2"/>
    <!-- Eyes - simple dots -->
    <circle cx="-25" cy="-15" r="5" fill="#333"/>
    <circle cx="25" cy="-15" r="5" fill="#333"/>
    <!-- Smile - upward arc -->
    <path d="M -30 20 Q 0 50 30 20" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== BEGINNER SAD (Row 1, Col 2) ==================== -->
  <g transform="translate(900, 182)">
    <!-- Head - simple circle -->
    <circle cx="0" cy="0" r="80" fill="#FFD993" stroke="#333" stroke-width="2"/>
    <!-- Eyes - simple dots -->
    <circle cx="-25" cy="-15" r="5" fill="#333"/>
    <circle cx="25" cy="-15" r="5" fill="#333"/>
    <!-- Frown - downward arc -->
    <path d="M -30 30 Q 0 10 30 30" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== INTERMEDIATE HAPPY (Row 2, Col 1) ==================== -->
  <g transform="translate(400, 425)">
    <!-- Head - oval -->
    <ellipse cx="0" cy="0" rx="70" ry="85" fill="#F5C589" stroke="#555" stroke-width="1.5"/>
    <!-- Ears -->
    <ellipse cx="-70" cy="-5" rx="12" ry="18" fill="#E8B878" stroke="#555" stroke-width="1"/>
    <ellipse cx="70" cy="-5" rx="12" ry="18" fill="#E8B878" stroke="#555" stroke-width="1"/>
    <!-- Hair -->
    <path d="M -55 -65 Q -60 -100 -20 -95 Q 0 -105 20 -95 Q 60 -100 55 -65" fill="#6B3A2A" stroke="none"/>
    <path d="M -58 -60 Q -65 -90 -20 -90 Q 0 -100 20 -90 Q 65 -90 58 -60" fill="#7B4A3A" stroke="none"/>
    <!-- Eyebrows - raised for happiness -->
    <path d="M -35 -38 Q -25 -48 -12 -40" fill="none" stroke="#5A3520" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 -40 Q 25 -48 35 -38" fill="none" stroke="#5A3520" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes - almond shaped, slightly squinted -->
    <ellipse cx="-24" cy="-22" rx="10" ry="7" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="-22" cy="-21" r="4" fill="#4A7A5B"/>
    <circle cx="-22" cy="-21" r="2" fill="#222"/>
    <ellipse cx="24" cy="-22" rx="10" ry="7" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="22" cy="-21" r="4" fill="#4A7A5B"/>
    <circle cx="22" cy="-21" r="2" fill="#222"/>
    <!-- Nose -->
    <path d="M 0 -10 Q 5 5 0 12 Q -3 14 -6 10" fill="none" stroke="#B8936E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smile - genuine with raised cheeks -->
    <path d="M -28 25 Q -15 42 0 45 Q 15 42 28 25" fill="none" stroke="#B05050" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheek blush -->
    <ellipse cx="-35" cy="15" rx="12" ry="6" fill="#FFB0A0" opacity="0.3"/>
    <ellipse cx="35" cy="15" rx="12" ry="6" fill="#FFB0A0" opacity="0.3"/>
  </g>

  <!-- ==================== INTERMEDIATE SAD (Row 2, Col 2) ==================== -->
  <g transform="translate(900, 425)">
    <!-- Head - oval -->
    <ellipse cx="0" cy="0" rx="70" ry="85" fill="#F5C589" stroke="#555" stroke-width="1.5"/>
    <!-- Ears -->
    <ellipse cx="-70" cy="-5" rx="12" ry="18" fill="#E8B878" stroke="#555" stroke-width="1"/>
    <ellipse cx="70" cy="-5" rx="12" ry="18" fill="#E8B878" stroke="#555" stroke-width="1"/>
    <!-- Hair -->
    <path d="M -55 -65 Q -60 -100 -20 -95 Q 0 -105 20 -95 Q 60 -100 55 -65" fill="#6B3A2A" stroke="none"/>
    <path d="M -58 -60 Q -65 -90 -20 -90 Q 0 -100 20 -90 Q 65 -90 58 -60" fill="#7B4A3A" stroke="none"/>
    <!-- Eyebrows - lowered/drooping -->
    <path d="M -35 -35 Q -25 -40 -12 -35" fill="none" stroke="#5A3520" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 -35 Q 25 -40 35 -35" fill="none" stroke="#5A3520" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes - downcast -->
    <ellipse cx="-24" cy="-22" rx="10" ry="8" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="-24" cy="-19" r="4" fill="#4A7A5B"/>
    <circle cx="-24" cy="-19" r="2" fill="#222"/>
    <ellipse cx="24" cy="-22" rx="10" ry="8" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="24" cy="-19" r="4" fill="#4A7A5B"/>
    <circle cx="24" cy="-19" r="2" fill="#222"/>
    <!-- Nose -->
    <path d="M 0 -10 Q 5 5 0 12 Q -3 14 -6 10" fill="none" stroke="#B8936E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Frown - drooped mouth corners -->
    <path d="M -22 30 Q -10 25 0 26 Q 10 25 22 30" fill="none" stroke="#B05050" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ==================== ADVANCED HAPPY (Row 3, Col 1) ==================== -->
  <g transform="translate(400, 670)">
    <!-- Face shape with jaw definition -->
    <path d="M -55 -60 Q -65 -20 -55 20 Q -45 65 0 75 Q 45 65 55 20 Q 65 -20 55 -60 Q 45 -85 0 -90 Q -45 -85 -55 -60 Z" fill="#F0C07A" stroke="none"/>
    <!-- Subtle shading on face -->
    <path d="M -55 -60 Q -65 -20 -55 20 Q -50 40 -35 55" fill="none" stroke="#E0A868" stroke-width="8" opacity="0.3" stroke-linecap="round"/>
    <path d="M 55 -60 Q 65 -20 55 20 Q 50 40 35 55" fill="none" stroke="#E0A868" stroke-width="8" opacity="0.3" stroke-linecap="round"/>
    <!-- Ears with detail -->
    <path d="M -58 -25 Q -72 -30 -72 -5 Q -72 15 -58 10" fill="#E8B070" stroke="#D4A060" stroke-width="1"/>
    <path d="M 58 -25 Q 72 -30 72 -5 Q 72 15 58 10" fill="#E8B070" stroke="#D4A060" stroke-width="1"/>
    <!-- Hair with volume -->
    <path d="M -55 -60 Q -60 -95 -30 -100 Q -10 -108 10 -105 Q 35 -100 50 -95 Q 65 -85 58 -55 Q 50 -70 30 -78 Q 10 -85 -10 -82 Q -35 -78 -50 -68 Z" fill="#5A2E1A" stroke="none"/>
    <path d="M -48 -65 Q -40 -80 -15 -82 Q 5 -85 25 -80 Q 45 -75 52 -60" fill="none" stroke="#7A4E3A" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <!-- Eyebrows - natural, slightly raised -->
    <path d="M -38 -45 Q -28 -55 -12 -48" fill="none" stroke="#4A2515" stroke-width="2" stroke-linecap="round"/>
    <path d="M 12 -48 Q 28 -55 38 -45" fill="none" stroke="#4A2515" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes - detailed with highlights (Duchenne smile = slightly squinted) -->
    <ellipse cx="-22" cy="-28" rx="12" ry="8" fill="white" stroke="#666" stroke-width="0.8"/>
    <circle cx="-20" cy="-27" r="5" fill="#4A7050"/>
    <circle cx="-20" cy="-27" r="2.5" fill="#1A1A1A"/>
    <circle cx="-18" cy="-29" r="1.2" fill="white" opacity="0.8"/>
    <!-- Crow's feet for genuine smile -->
    <line x1="-36" y1="-32" x2="-40" y2="-36" stroke="#C8A070" stroke-width="0.8" opacity="0.5"/>
    <line x1="-36" y1="-28" x2="-41" y2="-28" stroke="#C8A070" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="22" cy="-28" rx="12" ry="8" fill="white" stroke="#666" stroke-width="0.8"/>
    <circle cx="20" cy="-27" r="5" fill="#4A7050"/>
    <circle cx="20" cy="-27" r="2.5" fill="#1A1A1A"/>
    <circle cx="22" cy="-29" r="1.2" fill="white" opacity="0.8"/>
    <!-- Crow's feet right -->
    <line x1="36" y1="-32" x2="40" y2="-36" stroke="#C8A070" stroke-width="0.8" opacity="0.5"/>
    <line x1="36" y1="-28" x2="41" y2="-28" stroke="#C8A070" stroke-width="0.8" opacity="0.5"/>
    <!-- Nose - refined -->
    <path d="M -1 -18 Q 2 -5 0 5 Q -2 10 -7 12 Q -4 14 0 14 Q 4 14 7 12 Q 2 10 0 5" fill="none" stroke="#C8976A" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Warm Duchenne smile -->
    <path d="M -25 18 Q -15 35 0 38 Q 15 35 25 18" fill="#C04040" stroke="#A03030" stroke-width="1"/>
    <path d="M -20 20 Q 0 28 20 20" fill="white" stroke="none" opacity="0.6"/>
    <!-- Raised cheek muscles -->
    <ellipse cx="-32" cy="8" rx="15" ry="8" fill="#F0A880" opacity="0.25"/>
    <ellipse cx="32" cy="8" rx="15" ry="8" fill="#F0A880" opacity="0.25"/>
    <!-- Nasolabial folds -->
    <path d="M -14 5 Q -20 18 -26 25" fill="none" stroke="#D4A070" stroke-width="0.8" opacity="0.4"/>
    <path d="M 14 5 Q 20 18 26 25" fill="none" stroke="#D4A070" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ==================== ADVANCED SAD (Row 3, Col 2) ==================== -->
  <g transform="translate(900, 670)">
    <!-- Face shape - slight head tilt via transform -->
    <g transform="rotate(3)">
      <path d="M -55 -60 Q -65 -20 -55 20 Q -45 65 0 75 Q 45 65 55 20 Q 65 -20 55 -60 Q 45 -85 0 -90 Q -45 -85 -55 -60 Z" fill="#F0C07A" stroke="none"/>
      <!-- Subtle shading -->
      <path d="M -55 -60 Q -65 -20 -55 20 Q -50 40 -35 55" fill="none" stroke="#E0A868" stroke-width="8" opacity="0.3" stroke-linecap="round"/>
      <path d="M 55 -60 Q 65 -20 55 20 Q 50 40 35 55" fill="none" stroke="#E0A868" stroke-width="8" opacity="0.3" stroke-linecap="round"/>
      <!-- Ears -->
      <path d="M -58 -25 Q -72 -30 -72 -5 Q -72 15 -58 10" fill="#E8B070" stroke="#D4A060" stroke-width="1"/>
      <path d="M 58 -25 Q 72 -30 72 -5 Q 72 15 58 10" fill="#E8B070" stroke="#D4A060" stroke-width="1"/>
      <!-- Hair -->
      <path d="M -55 -60 Q -60 -95 -30 -100 Q -10 -108 10 -105 Q 35 -100 50 -95 Q 65 -85 58 -55 Q 50 -70 30 -78 Q 10 -85 -10 -82 Q -35 -78 -50 -68 Z" fill="#5A2E1A" stroke="none"/>
      <path d="M -48 -65 Q -40 -80 -15 -82 Q 5 -85 25 -80 Q 45 -75 52 -60" fill="none" stroke="#7A4E3A" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
      <!-- Eyebrows - inner raised (grief expression) -->
      <path d="M -35 -46 Q -28 -50 -12 -44" fill="none" stroke="#4A2515" stroke-width="2" stroke-linecap="round"/>
      <path d="M 12 -44 Q 28 -50 35 -46" fill="none" stroke="#4A2515" stroke-width="2" stroke-linecap="round"/>
      <!-- Eyes - glistening, slightly wider -->
      <ellipse cx="-22" cy="-28" rx="12" ry="10" fill="white" stroke="#666" stroke-width="0.8"/>
      <circle cx="-22" cy="-26" r="5" fill="#4A7050"/>
      <circle cx="-22" cy="-26" r="2.5" fill="#1A1A1A"/>
      <circle cx="-20" cy="-29" r="1.5" fill="white" opacity="0.9"/>
      <!-- Glistening effect - tear line -->
      <path d="M -34 -25 Q -33 -18 -30 -15" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
      <ellipse cx="22" cy="-28" rx="12" ry="10" fill="white" stroke="#666" stroke-width="0.8"/>
      <circle cx="22" cy="-26" r="5" fill="#4A7050"/>
      <circle cx="22" cy="-26" r="2.5" fill="#1A1A1A"/>
      <circle cx="24" cy="-29" r="1.5" fill="white" opacity="0.9"/>
      <!-- Nose -->
      <path d="M -1 -18 Q 2 -5 0 5 Q -2 10 -7 12 Q -4 14 0 14 Q 4 14 7 12 Q 2 10 0 5" fill="none" stroke="#C8976A" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Mouth - compressed lips, slight downturn -->
      <path d="M -18 22 Q -8 20 0 21 Q 8 20 18 22" fill="none" stroke="#B06060" stroke-width="2" stroke-linecap="round"/>
      <path d="M -14 24 Q 0 26 14 24" fill="none" stroke="#C08070" stroke-width="1" opacity="0.5"/>
      <!-- Forehead tension -->
      <line x1="-20" y1="-60" x2="20" y2="-60" stroke="#D8B080" stroke-width="0.6" opacity="0.3"/>
      <line x1="-15" y1="-55" x2="15" y2="-55" stroke="#D8B080" stroke-width="0.5" opacity="0.2"/>
      <!-- Nasolabial folds - deeper in sadness -->
      <path d="M -14 5 Q -22 18 -28 28" fill="none" stroke="#D4A070" stroke-width="1" opacity="0.5"/>
      <path d="M 14 5 Q 22 18 28 28" fill="none" stroke="#D4A070" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
</svg>